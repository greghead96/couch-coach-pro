// Fantasy points are ALWAYS derived fresh from the raw stat counts + current
// scoring settings — never trusted from a stored fp value. That's what keeps
// the roster row, team total, and the tap-to-see-breakdown modal in
// permanent agreement, and makes a scoring-rule change or a stat-persistence
// hiccup self-heal instead of leaving stale numbers on screen.
function quarterFpFromStats(pos, stats){
  return Math.round(quarterStatLines(pos, stats).reduce((s,l)=>s+l.pts,0)*10)/10;
}
function realQuarterly(pid, wk){
  const row=app.playerWeekStats[wk] && app.playerWeekStats[wk][pid];
  const q={1:0,2:0,3:0,4:0}, qtd={1:0,2:0,3:0,4:0};
  let pa=null; // DEF only: whole-game points-allowed component, not quarter-scoped
  if(row && row.q_pts){
    const pick=(app.draft&&app.draft.picks||[]).find(x=>x.player_id===pid);
    const pos=pick&&pick.pos;
    for(let i=1;i<=4;i++){ const v=row.q_pts[i]||row.q_pts[String(i)]; if(v){ q[i]=quarterFpFromStats(pos, v.stats); qtd[i]=v.qtd||0; } }
    if(row.q_pts.pa) pa={allowed:row.q_pts.pa.allowed||0, fp:defBracket(row.q_pts.pa.allowed||0)};
  }
  const firstQtdAt=row&&row.first_qtd_at?new Date(row.first_qtd_at).getTime():null;
  return {q, qtd, pa, firstQtdAt};
}
// Whole-game raw stat totals for one player-week, summed across quarters —
// for the player card's This Season tab, which shows the actual underlying
// stats (not just FP) so people can see what's driving the score, live as
// games are played and finalized once they're over. Returns null if we
// haven't polled anything for this player-week yet (bye, not yet played,
// or just not polled), so the UI can render blank instead of a fake zero.
function realWeekRawStats(pid, wk){
  const row=app.playerWeekStats[wk] && app.playerWeekStats[wk][pid];
  if(!row || !row.q_pts) return null;
  const stats={};
  for(let q=1;q<=4;q++){ const v=row.q_pts[q]||row.q_pts[String(q)];
    if(v && v.stats) Object.keys(v.stats).forEach(k=>{ stats[k]=(stats[k]||0)+v.stats[k]; }); }
  const allowed = row.q_pts.pa ? row.q_pts.pa.allowed : null;
  return {stats, allowed};
}
function slotPlayerIds(uid, wk){
  const picks=(app.draft?app.draft.picks:[]).filter(p=>p.user_id===uid);
  const snap=app.weeklyLineups[wk] && app.weeklyLineups[wk][uid];
  const cur= uid===(app.user&&app.user.id) ? app.lineup : app.lineupsByUser[uid];
  if(Array.isArray(snap) && snap.length===SLOTS.length) return snap;
  if(Array.isArray(cur) && cur.length===SLOTS.length) return cur;
  return defaultStarters(picks);
}
// Reconstructs a manager's real weekly score from real per-quarter stats +
// whatever power-ups were actually spent on those specific players/quarters.
function computeRealTeamScore(uid, wk){
  const picksWk=app.powerupPicks.filter(p=>p.week===wk);
  const byPlayerPU={}; picksWk.forEach(p=>{ byPlayerPU[p.player_id]=p; });
  const subOut={}; picksWk.filter(p=>p.powerup_key==="sub" && p.target_player_id).forEach(p=>{ subOut[p.target_player_id]={inId:p.player_id, q:p.quarter}; });
  const hotStartPick=picksWk.find(p=>p.powerup_key==="hotstart" && p.user_id===uid);
  const starterIds=slotPlayerIds(uid, wk).filter(Boolean);
  let total=0, bestTD=null;
  starterIds.forEach(pid=>{
    const swap=subOut[pid];
    for(let q=1;q<=4;q++){
      const contributor=(swap && q>=swap.q) ? swap.inId : pid;
      const rq=realQuarterly(contributor, wk);
      let fp=rq.q[q];
      const pu=byPlayerPU[contributor];
      if(pu && Number(pu.quarter)===q){ if(pu.powerup_key==="double") fp*=2; else if(pu.powerup_key==="freeze") fp=0; }
      total+=fp;
      if(q===1 && rq.pa) total+=rq.pa.fp; // whole-game DEF component, added once (not per-quarter, not power-up eligible)
      // "First" means real chronological order across the WHOLE week, not
      // quarter number — a Q1 score in the 8pm game happens later in real
      // time than a Q4 score in a 1pm game. Order by firstQtdAt (the actual
      // moment we detected it live) when available; a missing timestamp
      // (older data from before this was tracked) falls back to quarter
      // number and always loses to anything with a real timestamp.
      if(rq.qtd[q]>0){
        const key = rq.firstQtdAt!=null ? rq.firstQtdAt : (1e15+q);
        if(!bestTD || key<bestTD.key) bestTD={key,pid:contributor};
      }
    }
  });
  if(hotStartPick && bestTD && bestTD.pid===hotStartPick.player_id) total+=2*(app.settings.scoring.rushTD||6);
  return Math.round(total*10)/10;
}
// Per-player real total (power-up adjusted) for display on the roster rows.
// The team TOTAL (computeRealTeamScore) is the source of truth and also
// handles Emergency Sub's split-at-the-swap-quarter case exactly; this is
// the simpler per-row version so individual player cards aren't stuck at 0.
function realPlayerAdjustedTotal(pid, wk){
  const pu=app.powerupPicks.find(p=>p.week===wk && p.player_id===pid);
  const rq=realQuarterly(pid, wk);
  let total=rq.pa?rq.pa.fp:0;
  for(let q=1;q<=4;q++){ let fp=rq.q[q]; if(pu && Number(pu.quarter)===q){ if(pu.powerup_key==="double") fp*=2; else if(pu.powerup_key==="freeze") fp=0; } total+=fp; }
  return Math.round(total*10)/10;
}
function syncRealPointsToPlayers(){
  if(!app.realLeague) return;
  const wk=app.currentWeek||1;
  [...myStarters,...myBench,...oppStarters,...oppBench].forEach(p=>{ if(p.id && !p.id.startsWith("e_")) p.pts=realPlayerAdjustedTotal(p.id, wk); });
}
// wkCap lets playoff seeding ask for standings frozen at the end of the
// regular season (regSeasonWeeks+1) even after currentWeek has moved on
// into the playoffs — every other caller just omits it and gets "as of
// right now", same as before.
function getRealStandings(wkCap){
  const cap = wkCap!=null ? wkCap : (app.currentWeek||1);
  const rows=(app.members||[]).map(m=>({team:m.team_name||"Team", w:0,l:0,t:0, pf:0, pa:0, me:m.user_id===(app.user&&app.user.id), uid:m.user_id}));
  const byUid={}; rows.forEach(r=>byUid[r.uid]=r);
  for(let wk=1; wk<cap; wk++){
    app.schedule.filter(g=>g.week===wk).forEach(g=>{
      const H=byUid[g.home_user], A=byUid[g.away_user]; if(!H||!A) return;
      const hs=computeRealTeamScore(g.home_user,wk), as=computeRealTeamScore(g.away_user,wk);
      H.pf+=hs; H.pa+=as; A.pf+=as; A.pa+=hs;
      if(hs>as){ H.w++; A.l++; } else if(as>hs){ A.w++; H.l++; } else { H.t++; A.t++; }
    });
  }
  rows.forEach(r=>{ r.pf=Math.round(r.pf*10)/10; r.pa=Math.round(r.pa*10)/10; });
  // Tiebreak on point differential (PF-PA), not raw PF — a team that wins
  // low-scoring games shouldn't out-rank one that's actually outscoring
  // opponents by more, at the same record.
  const sorted=rows.sort((a,b)=>b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa));
  if(wkCap==null) syncStandingsCache(sorted); // only the "as of right now" view feeds the shared waiver-priority cache
  return sorted;
}
// Waiver processing (background job) has no access to the power-up-adjusted
// scoring engine — that logic only exists client-side — so any browser that
// computes real standings best-effort pushes them here for the job to read
// when ordering Reverse Standings waiver priority. Guarded so it only
// writes when the snapshot actually changed, not on every render.
function syncStandingsCache(rows){
  if(!app.sbLeagueId) return;
  const snap=rows.map(r=>({uid:r.uid,w:r.w,l:r.l,t:r.t,pf:r.pf,pa:r.pa}));
  const key=JSON.stringify(snap);
  if(app._lastStandingsPush===key) return;
  app._lastStandingsPush=key;
  sb.rpc("sync_standings_cache",{lid:app.sbLeagueId, standings:snap}).then(({error})=>{ if(error) app._lastStandingsPush=null; });
}
// Worst-first order for waiver priority. Both methods use the persisted
// list the background job maintains once it's current for this week;
// Reverse Standings additionally recomputes fresh from getRealStandings()
// the moment a new week starts (see phase5 SQL / poll-scores.js's
// buildPriorityOrder — same logic, mirrored here for display since the
// server-side run is the one that actually matters).
function computeWaiverOrder(){
  const method=(app.settings.league&&app.settings.league.waiver)||"Reverse standings";
  const memberIds=(app.members||[]).map(m=>m.user_id);
  let order;
  // Reverse Standings carries forward this week's already-rotated order
  // (see poll-scores.js's buildPriorityOrder) once it's been through at
  // least one processing run this week — same "persist unless the week
  // just turned over" rule as Rolling priority, so a manager who skipped
  // claims while others ahead claimed shows correctly bumped up for the
  // rest of the week instead of visually reverting to raw standings.
  const sameWeek = app.leagueWaiverPriorityWeek!=null && app.leagueWaiverPriorityWeek===app.leagueCurrentWeek;
  if(method==="Rolling priority" || sameWeek){
    const saved=(app.leagueWaiverPriority||[]).filter(u=>memberIds.includes(u));
    const missing=memberIds.filter(u=>!saved.includes(u));
    order=[...saved,...missing];
  } else {
    // Before any games are played every team is tied 0-0-0 — with no other
    // tiebreak, a stable "worst first" sort of an all-tied array comes out
    // IDENTICAL to "best first" (reversing a full tie changes nothing),
    // so during preseason testing Reverse Standings looked exactly like
    // regular standings. Ties fall back to reversed original draft order
    // (last drafter picks first pre-Week-1) — same convention ESPN/Sleeper
    // use before there's a real record to sort by.
    const draftOrder=(app.draft&&app.draft.order)||[];
    const draftIdx=(uid)=>{ const i=draftOrder.indexOf(uid); return i<0?draftOrder.length:i; };
    order=getRealStandings().slice()
      .sort((a,b)=> (a.w-b.w) || ((a.pf-a.pa)-(b.pf-b.pa)) || (draftIdx(b.uid)-draftIdx(a.uid)))
      .map(r=>r.uid);
  }
  return {method, order};
}

    const dn=el("button","btn sm sec","↓"); dn.disabled=i===mine.length-1; dn.onclick=()=>reorderClaim(mine,i,1);
    const cancel=el("button","btn sm sec","✕"); cancel.onclick=async()=>{

      catch(e){ toast(e.message||"Cancel failed"); } };
    btns.append(up,dn,cancel); row.appendChild(btns);
    cc.appendChild(row);
  });

  // Sorted by processed_at, not the array's incoming order — waiver_claims
  // loads ordered by each claim's own PRIORITY (1,2,3... per user), which
  // interleaves unpredictably across different users/claims and doesn't
  // reflect when a claim actually ran; the most recently processed claim
  // could easily land second or third in that raw order.
  const history=(app.waiverClaims||[]).filter(x=>x.status!=="pending" && x.user_id===(app.user&&app.user.id))
    .sort((a,b)=> new Date(b.processed_at||b.created_at) - new Date(a.processed_at||a.created_at)).slice(0,10);

    });

  }
}
async function reorderClaim(mine, i, dir){
  const j=i+dir; if(j<0||j>=mine.length) return;
  const ids=mine.map(x=>x.id);
  const tmp=ids[i]; ids[i]=ids[j]; ids[j]=tmp;
  try{ const {error}=await sb.rpc("reorder_waiver_claims",{lid:app.sbLeagueId, ordered_ids:ids}); if(error) throw error; await loadWaivers(); renderTeam(); }
  catch(e){ toast(e.message||"Reorder failed"); }
}

function renderDraft(){

  teamRow.appendChild(teamSel); s.appendChild(teamRow);
  posChips(s); sortControl(s);

// ============================ PLAYOFFS BRACKET ============================
// Standard single-elimination seeding order (like the NCAA tournament): for
// a bracket of `size` slots, returns the seed numbers in bracket-slot order
// so that adjacent pairs are the round-1 matchups — e.g. size=8 gives
// [1,8,4,5,2,7,3,6] → (1v8),(4v5),(2v7),(3v6). Byes fall out naturally: any
// "seed" beyond the real team count is a phantom, so its pairing partner
// gets a bye instead of a round-1 game.
function seedOrder(size){
  if(size<=1) return [1];
  const prev=seedOrder(size/2);
  const out=[];
  prev.forEach(x=>{ out.push(x); out.push(size+1-x); });
  return out;
}
// Builds every round from a real team count `n` — round 1 pairs seeds per
// seedOrder (nulls = bye), then each later round is just "TBD vs TBD"
// slots since who actually advances depends on real results as the season
// plays out (this bracket is a seeded preview, not an auto-scored one).
function buildBracket(n){
  const rounds=Math.max(1, Math.ceil(Math.log2(Math.max(n,2))));
  const size=Math.pow(2,rounds);
  const order=seedOrder(size);
  const round1=[];
  for(let i=0;i<order.length;i+=2){
    const a=order[i], b=order[i+1];
    round1.push({a: a<=n?a:null, b: b<=n?b:null});
  }
  const roundsOut=[round1];
  let count=round1.length;
  while(count>1){ count=count/2; roundsOut.push(new Array(count).fill(null)); }
  return roundsOut; // roundsOut[0] = round 1 (seed pairs), later rounds = empty TBD slots
}
function roundLabel(idx, total, hasByes){
  const fromEnd=total-1-idx;
  if(fromEnd===0) return "Championship";
  if(fromEnd===1) return "Semifinals";
  if(idx===0 && hasByes) return "Wild Card";
  if(fromEnd===2) return "Quarterfinals";
  return "Round of "+Math.pow(2,fromEnd+1);
}
// Before the regular season ends, there's no real bracket to advance yet —
// show a projected seeding preview (top N by CURRENT record) so managers
// can see roughly where they'd stand if the season ended today.
function renderPlayoffPreview(s){
  const lg=app.settings.league;

  const start=m?parseInt(m[0],10):15;
  const bracket=buildBracket(n);
  const totalRounds=bracket.length;
  const hasByes=bracket[0].some(p=>p.a==null||p.b==null);
  const span=totalRounds*wpr;
  const tl=(seed)=> seed
    ? `<b style="color:${seed.me?'var(--you)':'var(--txt)'}">${seed.team}</b> <span class="muted" style="font-size:11px">(${seed.w}-${seed.l})</span>`
    : '<span class="muted">TBD</span>';
  const byeSeed=(i)=>{ // which seed # gets the round-1 bye at slot pair i (if any)
    const p=bracket[0][i]; if(p.a && !p.b) return p.a; if(p.b && !p.a) return p.b; return null;
  };

  s.appendChild(el("div","card",`<h2 class="title">🏆 Playoffs</h2>
    <div class="muted" style="font-size:12px">Projected — top <b style="color:var(--txt)">${n}</b> seeds by <b style="color:var(--gold)">CCF</b> record if the season ended today. Weeks ${start}–${start+span-1} (${wpr} wk/round).${hasByes?" Top seeds get a first-round bye.":""} Locks in once the regular season ends.</div>`));

  // visual bracket
  const br=el("div","card"); br.appendChild(el("h2","title","Bracket"));
  const bt=(seedNum,note)=>{ const seed=seedNum?seeds[seedNum-1]:null;
    return seed?`<div class="bt${seed.me?' me':''}">${seed.team}${note?` <span class="muted" style="font-size:9px">${note}</span>`:""}</div>`:`<div class="bt muted">TBD</div>`; };
  const bwrap=el("div","bracket");
  bracket.forEach((round,ri)=>{
    const rd=el("div","bround"); rd.innerHTML=`<h4>${roundLabel(ri,totalRounds,hasByes)}</h4>`;
    if(ri===0){
      round.forEach((p,i)=>{
        const byeNum=byeSeed(i);
        rd.appendChild(bmatchEl([bt(p.a, p.a===byeNum?"bye":null), bt(p.b, p.b===byeNum?"bye":null)]));
      });
    } else {
      round.forEach(()=> rd.appendChild(bmatchEl(['<div class="bt muted">TBD</div>','<div class="bt muted">TBD</div>'])));
    }
    bwrap.appendChild(rd);
  });
  br.appendChild(bwrap); s.appendChild(br);

  const sd=el("div","card"); sd.appendChild(el("h2","title","Seeds"));
  seeds.forEach((t,i)=>{
    const seedNum=i+1;
    const isBye=bracket[0].some(p=> (p.a===seedNum && !p.b) || (p.b===seedNum && !p.a));
    sd.appendChild(el("div","schrow", `<span class="wk">#${seedNum}</span><span style="flex:1">${tl(t)}</span>
     <span class="muted" style="font-size:11px">${isBye?'BYE':''}</span>`));
  });
  s.appendChild(sd);

  bracket.forEach((round,ri)=>{
    const wk=start+ri*wpr;
    const wkLabel = wpr>1 ? `Wk ${wk}-${wk+wpr-1}` : `Wk ${wk}`;
    const c=el("div","card"); c.appendChild(el("h2","title",`${roundLabel(ri,totalRounds,hasByes)} · ${wkLabel}`));
    round.forEach((p,i)=>{
      if(ri===0){
        const byeNum=byeSeed(i);
        if(byeNum){
          c.appendChild(el("div","",`<div style="padding:9px 0;border-top:1px solid var(--line);font-size:13px">
            <div>${tl(seeds[byeNum-1])}</div><div class="muted" style="font-size:10px;margin:3px 0">bye — advances automatically</div></div>`));
          return;
        }
        c.appendChild(el("div","",`<div style="padding:9px 0;border-top:1px solid var(--line);font-size:13px">
          <div>${tl(seeds[p.a-1])}</div><div class="muted" style="font-size:10px;margin:3px 0">vs</div><div>${tl(seeds[p.b-1])}</div></div>`));
      } else {
        const lab = ri===totalRounds-1 ? "🏆 for it all" : "vs";
        c.appendChild(el("div","",`<div style="padding:9px 0;border-top:1px solid var(--line);font-size:13px">
          <div><span class="muted">TBD</span></div><div class="muted" style="font-size:10px;margin:3px 0">${lab}</div><div><span class="muted">TBD</span></div></div>`));
      }
    });
    s.appendChild(c);
  });
}
function bmatchEl(lines){ const d=el("div","bmatch"); d.innerHTML=lines.join(""); return d; }

// ============================ PLAYOFFS: REAL, AUTO-ADVANCING ============================
function sumScore(uid, wkStart, wkEnd){
  let t=0; for(let w=wkStart; w<=wkEnd; w++) t+=computeRealTeamScore(uid, w);
  return Math.round(t*10)/10;
}
function playoffConfig(){
  const lg=app.settings.league;
  const regEnd=lg.regSeasonWeeks||14;
  const wpr=lg.playoffWeeksPerRound||1;
  const m=(lg.playoffWeeks||"15-17").match(/\d+/);
  const startWeek=m?parseInt(m[0],10):regEnd+1;
  const nMain=Math.max(2, lg.playoffTeams||6);
  return {regEnd, wpr, startWeek, nMain};
}
// Pure function of (ordered seed list, timing, current week) → the full
// desired state of one bracket. Deterministic and idempotent — any client
// can recompute this from scratch and it converges to the same answer,
// same philosophy as syncStandingsCache. Byes resolve immediately; a real
// matchup only gets a winner once its weeks have actually completed
// (currentWeek past end_week). Ties (astronomically unlikely with decimal
// scoring) go to the better seed.
function computeBracketState(bracketName, seeds, startWeek, wpr, wk){
  const n=seeds.length;
  if(n<2) return [];
  const rounds=buildBracket(n);
  const totalRounds=rounds.length;
  const slotWinnerUid=[], slotWinnerSeed=[];
  const out=[];
  for(let ri=0; ri<totalRounds; ri++){
    const roundStart=startWeek+ri*wpr, roundEnd=roundStart+wpr-1;
    slotWinnerUid[ri]=[]; slotWinnerSeed[ri]=[];
    const count=rounds[ri].length;
    for(let slot=0; slot<count; slot++){
      let seedA,seedB,uidA,uidB;
      if(ri===0){
        const p=rounds[0][slot];
        seedA=p.a; seedB=p.b;
        uidA = seedA ? (seeds[seedA-1]&&seeds[seedA-1].uid) : null;
        uidB = seedB ? (seeds[seedB-1]&&seeds[seedB-1].uid) : null;
      } else {
        seedA=slotWinnerSeed[ri-1][slot*2]||null; seedB=slotWinnerSeed[ri-1][slot*2+1]||null;
        uidA=slotWinnerUid[ri-1][slot*2]||null; uidB=slotWinnerUid[ri-1][slot*2+1]||null;
      }
      // Lower seed number = better = "home", for display and as the tie-break winner.
      let homeSeed=seedA, awaySeed=seedB, homeUser=uidA, awayUser=uidB;
      if(seedA!=null && seedB!=null && seedB<seedA){ homeSeed=seedB; awaySeed=seedA; homeUser=uidB; awayUser=uidA; }
      // Byes are a STRUCTURAL round-1-only thing (a phantom seed with no
      // real opponent at all). For round>0, "one side present" just means
      // the other round's feeder match hasn't finished yet — treating that
      // as a bye would crown the known side a winner before their actual
      // opponent is even decided, for every bracket size that isn't a
      // power of 2 (i.e. almost every real league).
      const isBye = ri===0 && (!!homeUser !== !!awayUser);
      let winnerUid=null, winnerSeed=null;
      if(isBye){ winnerUid=homeUser||awayUser; winnerSeed=homeSeed!=null?homeSeed:awaySeed; }
      else if(homeUser && awayUser && wk>roundEnd){
        const hs=sumScore(homeUser,roundStart,roundEnd), as=sumScore(awayUser,roundStart,roundEnd);
        if(hs>as){ winnerUid=homeUser; winnerSeed=homeSeed; }
        else if(as>hs){ winnerUid=awayUser; winnerSeed=awaySeed; }
        else { winnerUid=homeSeed<=awaySeed?homeUser:awayUser; winnerSeed=homeSeed<=awaySeed?homeSeed:awaySeed; }
      }
      slotWinnerUid[ri][slot]=winnerUid; slotWinnerSeed[ri][slot]=winnerSeed;
      out.push({bracket:bracketName, round:ri, slot, home_user:homeUser||"", away_user:awayUser||"",
        home_seed:homeSeed, away_seed:awaySeed, start_week:roundStart, end_week:roundEnd,
        winner_user:winnerUid||"", is_bye:isBye});
    }
  }
  return out;
}
// Runs whenever a real-league client views the League/Playoffs tab (once
// the regular season is over). Recomputes the whole bracket from scratch
// and syncs it — cheap no-op if nothing's changed since the last sync.
// Returns true if anything actually changed (caller may want to re-render).
async function ensurePlayoffBracket(){
  if(!app.realLeague || app._playoffSyncInFlight) return false;
  const {regEnd, wpr, startWeek, nMain}=playoffConfig();
  const wk=app.currentWeek||1;
  if(wk<=regEnd) return false;
  const memberIds=(app.members||[]).map(m=>m.user_id);
  if(memberIds.length<2) return false;

  const finalStandings=getRealStandings(regEnd+1);
  const mainSeeds=finalStandings.slice(0,nMain);
  const consSeeds=finalStandings.slice(nMain);

  const toSync=computeBracketState('main', mainSeeds, startWeek, wpr, wk);
  if(consSeeds.length>=2) toSync.push(...computeBracketState('consolation', consSeeds, startWeek, wpr, wk));
  if(!toSync.length) return false;

  const key=JSON.stringify(toSync);
  if(app._lastPlayoffSync===key) return false;
  app._playoffSyncInFlight=true;
  try{
    const {error}=await sb.rpc("sync_playoff_bracket",{lid:app.sbLeagueId, matchups:toSync});
    if(error){ app._playoffSyncInFlight=false; return false; }
    app._lastPlayoffSync=key;
    await loadPlayoffMatchups();
  } finally { app._playoffSyncInFlight=false; }
  return true;
}
function bracketRoundsFor(name){
  const rows=(app.playoffMatchups||[]).filter(m=>m.bracket===name);
  const maxRound=rows.reduce((mx,r)=>Math.max(mx,r.round),-1);
  const rounds=[];
  for(let ri=0; ri<=maxRound; ri++) rounds.push(rows.filter(r=>r.round===ri).sort((a,b)=>a.slot-b.slot));
  return rounds;
}
function renderOneBracket(s, title, name, wpr){
  const rounds=bracketRoundsFor(name);
  if(!rounds.length) return;
  const totalRounds=rounds.length;
  const hasByes=rounds[0].some(r=>r.is_bye);
  const card=el("div","card"); card.appendChild(el("h2","title",title));
  const bwrap=el("div","bracket");
  rounds.forEach((round,ri)=>{
    const rd=el("div","bround"); rd.innerHTML=`<h4>${roundLabel(ri,totalRounds,hasByes)}</h4>`;
    round.forEach(m=>{
      const line=(uid,won)=> uid?`<div class="bt${uid===(app.user&&app.user.id)?' me':''}">${teamNameOf(uid)}${won?' <span class="muted" style="font-size:9px">✓ won</span>':''}${m.is_bye&&uid?' <span class="muted" style="font-size:9px">bye</span>':''}</div>`:`<div class="bt muted">TBD</div>`;
      rd.appendChild(bmatchEl([line(m.home_user, m.winner_user&&m.winner_user===m.home_user), m.is_bye?"":line(m.away_user, m.winner_user&&m.winner_user===m.away_user)]));
    });
    bwrap.appendChild(rd);
  });
  card.appendChild(bwrap); s.appendChild(card);

  rounds.forEach((round,ri)=>{
    const wkLabel = wpr>1 ? `Wk ${round[0].start_week}-${round[0].end_week}` : `Wk ${round[0].start_week}`;
    const c=el("div","card"); c.appendChild(el("h2","title",`${roundLabel(ri,totalRounds,hasByes)} · ${wkLabel}`));
    round.forEach(m=>{
      const nameOf=(uid)=>{ const un=usernameOf(uid); return `<b style="color:${uid===(app.user&&app.user.id)?'var(--you)':'var(--txt)'}">${teamNameOf(uid)}</b>${un?` <span class="muted" style="font-size:11px">(${un})</span>`:""}`; };
      if(m.is_bye){
        const who=m.home_user||m.away_user;
        c.appendChild(el("div","",`<div style="padding:9px 0;border-top:1px solid var(--line);font-size:13px"><div>${nameOf(who)}</div><div class="muted" style="font-size:10px;margin:3px 0">bye — advances automatically</div></div>`));
        return;
      }
      if(!m.home_user || !m.away_user){
        // One side may already be known (advanced from an earlier round)
        // while the other is still waiting on its own match to finish.
        const homeSide=m.home_user?nameOf(m.home_user):'<span class="muted">TBD</span>';
        const awaySide=m.away_user?nameOf(m.away_user):'<span class="muted">TBD</span>';
        c.appendChild(el("div","",`<div style="padding:9px 0;border-top:1px solid var(--line);font-size:13px"><div>${homeSide}</div><div class="muted" style="font-size:10px;margin:3px 0">vs</div><div>${awaySide}</div></div>`));
        return;
      }
      const done=!!m.winner_user;
      const hs=done?sumScore(m.home_user,m.start_week,m.end_week):null, as=done?sumScore(m.away_user,m.start_week,m.end_week):null;
      const homeTxt=`${nameOf(m.home_user)}${done?` <b style="color:var(--gold)">${hs.toFixed(1)}</b>`:""}${m.winner_user===m.home_user?" 🏆":""}`;
      const awayTxt=`${nameOf(m.away_user)}${done?` <b style="color:var(--gold)">${as.toFixed(1)}</b>`:""}${m.winner_user===m.away_user?" 🏆":""}`;
      c.appendChild(el("div","",`<div style="padding:9px 0;border-top:1px solid var(--line);font-size:13px"><div>${homeTxt}</div><div class="muted" style="font-size:10px;margin:3px 0">${ri===totalRounds-1?"🏆 for it all":"vs"}</div><div>${awayTxt}</div></div>`));
    });
    s.appendChild(c);
  });
}
function renderPlayoffBracketReal(s, wpr){
  const mainRounds=bracketRoundsFor('main');
  const champRound=mainRounds[mainRounds.length-1];
  const champ=champRound && champRound[0] && champRound[0].winner_user ? teamNameOf(champRound[0].winner_user) : null;
  s.appendChild(el("div","card",`<h2 class="title">🏆 Playoffs</h2>

function renderPlayoffs(s){

  // League setup
  const setup=el("div","card"); setup.appendChild(el("h2","title","League Setup"));
  setup.append(
    cRow("Number of teams","8–16", cNum(lg.teams,1,v=>lg.teams=v)),
    cRow("Roster size","spots per team", cNum(lg.rosterSize,1,v=>lg.rosterSize=v)),
  );
  s.appendChild(setup);

  // Acquisitions & trades
  const acq=el("div","card"); acq.appendChild(el("h2","title","Acquisitions & Trades"));
  acq.append(
    cRow("Waiver type","", cSel(["Rolling priority","Reverse standings"], lg.waiver, v=>{lg.waiver=v;renderCommish();})),
  );
  acq.append(el("div","muted","<div style='font-size:11px;margin:-4px 0 8px'>Reverse standings resets every week — worst record picks first. Rolling priority persists week to week — only a successful claim sends you to the back.</div>"));
  acq.append(
    cRow("Trade deadline","", cSel(["Week 9","Week 10","Week 11","Week 12","No deadline"], lg.tradeDeadline, v=>{lg.tradeDeadline=v;renderCommish();})),
    cRow("Trade review","who approves", cSel(["Commissioner","League vote","No review"], lg.tradeReview, v=>{lg.tradeReview=v;renderCommish();})),
  );
  s.appendChild(acq);

  // Schedule & playoffs
  const sch=el("div","card"); sch.appendChild(el("h2","title","Schedule & Playoffs"));
  sch.append(
    cRow("Regular season weeks","", cNum(lg.regSeasonWeeks,1,v=>lg.regSeasonWeeks=v)),
    cRow("Playoff teams","bracket auto-sizes to this, with byes for the top seeds as needed", cNum(lg.playoffTeams,1,v=>{lg.playoffTeams=Math.max(2,v);renderCommish();})),
    cRow("Playoffs start","", cSel(["14-16","15-17","16-18"], lg.playoffWeeks, v=>{lg.playoffWeeks=v;renderCommish();})),
    cRow("Weeks per round","matchups can span 1 or 2 weeks each", cSeg([[1,"1 week"],[2,"2 weeks"]], lg.playoffWeeksPerRound||1, v=>{lg.playoffWeeksPerRound=v;renderCommish();})),
  );
  s.appendChild(sch);

  // Moved here from the draft board (was too easy to hit by accident
  // mid-draft) — commissioner-only, works regardless of draft phase.
  const danger=el("div","card"); danger.style.borderColor="var(--red)";
  danger.appendChild(el("h2","title","Danger Zone"));
  const rb=el("button","btn"); rb.style.width="100%"; rb.textContent="⚠️ Reset League for New Season";
  rb.onclick=async ()=>{
    const warn="⚠️ This resets the ENTIRE league, not just the draft:\n\n"
      +"• Every draft pick — everyone's roster goes to zero\n"
      +"• All power-up usage and history\n"
      +"• Saved lineups\n"
      +"• Waiver claims and waiver history\n"
      +"• Trades and votes\n"
      +"• The playoff bracket\n"
      +"• The transaction log\n"
      +"• Current week resets back to 1\n"
      +"• Preseason test stats (real-season stats already in progress for other leagues are untouched)\n\n"
      +"This cannot be undone. Everyone will need to redraft. Continue?";
    if(!confirm(warn)) return;
    try{ const {error}=await sb.rpc("reset_draft",{lid:app.sbLeagueId}); if(error) throw error;
      app.queue=[]; saveQueue();
      await Promise.all([loadDraft(), loadLeagueData(), loadWaivers(), loadTrades(), loadPlayoffMatchups(), loadTransactions(), loadSchedule()]);
      toast("League reset — ready for a fresh draft"); render(); }
    catch(e){ toast(e.message||"Reset failed"); } };
  danger.appendChild(rb);
  s.appendChild(danger);

  const save=el("button","btn"); save.style.width="100%"; save.style.marginBottom="20px"; save.textContent="Save League Settings";
  save.onclick=async ()=>{
    if(!app.realLeague){ toast("Demo mode — settings save once you're in a real league"); return; }
    save.disabled=true; save.textContent="Saving…";
    try{ const { error } = await sb.from("leagues").update({ settings:app.settings }).eq("id", app.sbLeagueId); if(error) throw error; toast("League settings saved ✓"); }
    catch(e){ toast(e.message||"Save failed"); }
    save.disabled=false; save.textContent="Save League Settings";
  };
  s.appendChild(save);
}

// ============================ NFL LIVE (real ESPN data) ============================
const ESPN="https://site.api.espn.com/apis/site/v2/sports/football/nfl";
function teamLogo(u,sz){ return u?`<img src="${u}" style="width:${sz||18}px;height:${sz||18}px;vertical-align:middle" onerror="this.style.display='none'">`:""; }
function seasonLabel(s){ const t={1:"Preseason",2:"Regular Season",3:"Postseason",4:"Offseason"}; return (s&&t[s.type]||"NFL")+" "+((s&&s.year)||""); }
function ensureNFL(){ if(!app.nfl.games && !app.nfl.loading && !app.nfl.error) loadNFLScoreboard(); }
async function loadNFLScoreboard(){
  app.nfl.loading=true; app.nfl.error=null;
  try{
    const d=await (await fetch(ESPN+"/scoreboard")).json();
    app.nfl.season=d.season;
    app.nfl.games=(d.events||[]).map(e=>{
      const c=e.competitions[0];
      const home=c.competitors.find(x=>x.homeAway==="home")||c.competitors[0];
      const away=c.competitors.find(x=>x.homeAway==="away")||c.competitors[1];
      return { id:e.id, state:e.status.type.state, status:e.status.type.shortDetail,
        home:{ab:home.team.abbreviation, score:home.score, logo:(home.team&&home.team.logo)||""},
        away:{ab:away.team.abbreviation, score:away.score, logo:(away.team&&away.team.logo)||""} };
    });
  }catch(err){ app.nfl.error="Couldn't reach ESPN — tap retry."; }
  app.nfl.loading=false;
  if(app.tab==="nfl") renderNFL();
}
async function loadGamecast(id, silent){
  app.nfl.selected=id;
  if(!silent){ app.nfl.gamecast=null; app.nfl.view="plays"; renderNFL(); }
  try{
    const d=await (await fetch(ESPN+"/summary?event="+id)).json();
    const dr=d.drives||{};
    const drivesList=[...(dr.previous||[])]; if(dr.current) drivesList.push(dr.current);
    const plays=[];
    drivesList.forEach(drv=>(drv.plays||[]).forEach(p=>plays.push({
      q:(p.period&&p.period.number)||"?", clock:(p.clock&&p.clock.displayValue)||"",
      text:p.text||"", scoring:!!p.scoringPlay, away:p.awayScore, home:p.homeScore })));
    const box=((d.boxscore&&d.boxscore.players)||[]).map(tm=>({
      ab:(tm.team&&tm.team.abbreviation)||"",
      groups:(tm.statistics||[]).map(g=>({ name:g.name, labels:g.labels||[],
        rows:(g.athletes||[]).map(a=>({ name:(a.athlete&&a.athlete.displayName)||"", stats:a.stats||[] })) })) }));
    app.nfl.gamecast={ plays, box };
  }catch(err){ app.nfl.gamecast={error:true}; }
  if(app.tab==="nfl") renderNFL();
}
function startPoll(id){
  if(app.nfl.pollId && app.nfl.pollFor===id) return;
  stopPoll(); app.nfl.pollFor=id;
  app.nfl.pollId=setInterval(()=>{ if(app.tab==="nfl" && app.nfl.selected===id) loadGamecast(id,true); else stopPoll(); }, 20000);
}
function stopPoll(){ if(app.nfl.pollId){ clearInterval(app.nfl.pollId); app.nfl.pollId=null; app.nfl.pollFor=null; } }
function renderNFL(){
  const s=$("screen"); if(!s) return; s.innerHTML="";
  s.appendChild(el("div","card",`<h2 class="title">🏈 NFL Live · real ESPN data</h2>
    <div class="muted" style="font-size:12px">Live scores, full play-by-play, and player box scores — straight from ESPN's public API. Tap a game.</div>`));
  if(app.nfl.loading){ s.appendChild(el("div","card","<div class='muted' style='text-align:center;padding:12px'>🔄 Loading live games…</div>")); return; }
  if(app.nfl.error){
    const c=el("div","card"); c.innerHTML=`<div class="muted">⚠ ${app.nfl.error}</div>`;
    const b=el("button","btn"); b.style.width="100%"; b.style.marginTop="10px"; b.textContent="Retry";
    b.onclick=()=>{ app.nfl.error=null; ensureNFL(); renderNFL(); }; c.appendChild(b); s.appendChild(c); return;
  }
  if(!app.nfl.games) return;
  if(app.nfl.selected){ renderGamecast(s); return; }
  s.appendChild(el("div","muted",`<div style='font-size:11px;text-align:center;margin-bottom:8px'>${seasonLabel(app.nfl.season)} · ${app.nfl.games.length} games</div>`));
  app.nfl.games.forEach(g=>{
    const live=g.state==="in", post=g.state==="post";
    const sc=live?"var(--you)":post?"var(--muted)":"var(--gold)";
    const c=el("div","card"); c.style.cursor="pointer"; c.style.padding="12px"; c.style.marginBottom="10px";
    c.innerHTML=`<div class="row">
      <span style="flex:1">${teamLogo(g.away.logo)} <b>${g.away.ab}</b> ${g.away.score!=null?g.away.score:""}</span>
      <span style="flex:1;text-align:center;font-size:11px;color:${sc}">${live?"🔴 ":""}${g.status}</span>
      <span style="flex:1;text-align:right">${g.home.score!=null?g.home.score:""} <b>${g.home.ab}</b> ${teamLogo(g.home.logo)}</span></div>`;
    c.onclick=()=>loadGamecast(g.id);
    s.appendChild(c);
  });
  const r=el("button","btn sec"); r.style.width="100%"; r.textContent="↻ Refresh"; r.onclick=()=>{ app.nfl.games=null; ensureNFL(); renderNFL(); };
  s.appendChild(r);
}
function renderGamecast(s){
  const g=app.nfl.games.find(x=>x.id===app.nfl.selected);
  if(g && g.state==="in") startPoll(g.id); else stopPoll();
  const back=el("button","btn sec"); back.style.width="100%"; back.style.marginBottom="12px"; back.textContent="← All games";
  back.onclick=()=>{ stopPoll(); app.nfl.selected=null; app.nfl.gamecast=null; renderNFL(); };
  s.appendChild(back);
  if(g){
    s.appendChild(el("div","card",`<div class="scoreboard">
      <div class="ts me"><div class="nm">${teamLogo(g.away.logo,22)}<br>${g.away.ab}</div><div class="pts">${g.away.score!=null?g.away.score:0}</div></div>
      <div class="clock"><div class="q">${g.state==='in'?'🔴 LIVE':g.state==='post'?'FINAL':'SOON'}</div><div class="st">${g.status}${g.state==='in'?' · auto-refresh':''}</div></div>
      <div class="ts op"><div class="nm">${teamLogo(g.home.logo,22)}<br>${g.home.ab}</div><div class="pts">${g.home.score!=null?g.home.score:0}</div></div>
    </div>`));
  }
  if(!app.nfl.gamecast){ s.appendChild(el("div","card","<div class='muted' style='text-align:center;padding:12px'>🔄 Loading game details…</div>")); return; }
  if(app.nfl.gamecast.error){ s.appendChild(el("div","card","<div class='muted'>Couldn't load game details.</div>")); return; }
  const ts=el("div","tabset");
  [["plays","Gamecast"],["box","Box Score"]].forEach(([id,lab])=>{
    const b=el("button",app.nfl.view===id?"on":"",lab); b.onclick=()=>{ app.nfl.view=id; renderNFL(); }; ts.appendChild(b);
  });
  s.appendChild(ts);
  if(app.nfl.view==="box") renderBox(s); else renderPlays(s,g);
}
function renderPlays(s,g){
  const plays=(app.nfl.gamecast.plays||[]).slice().reverse();
  const c=el("div","card"); c.appendChild(el("h2","title","Play-by-Play · latest first"));
  if(!plays.length){ c.appendChild(el("div","muted","<div style='font-size:13px'>No plays yet — game hasn't started.</div>")); s.appendChild(c); return; }
  plays.slice(0,120).forEach(p=>{
    const d=el("div","");
    d.style.cssText="padding:8px 0;border-top:1px solid var(--line);font-size:13px"+(p.scoring?";border-left:3px solid var(--gold);padding-left:8px":"");
    const score=(p.scoring&&p.away!=null)?` <span class="muted" style="font-size:11px">(${g?g.away.ab:''} ${p.away}–${p.home} ${g?g.home.ab:''})</span>`:"";
    d.innerHTML=`<span class="muted" style="font-size:11px">Q${p.q} ${p.clock}</span> ${p.scoring?'🏈 ':''}${p.text}${score}`;
    c.appendChild(d);
  });
  s.appendChild(c);
  s.appendChild(el("div","muted","<div style='font-size:11px;text-align:center'>💡 Each play carries its quarter — the exact data CCF uses to resolve power-ups.</div>"));
}
function renderBox(s){
  const box=app.nfl.gamecast.box||[];
  const want=["passing","rushing","receiving","kicking","defensive"];
  const nice={passing:"Passing",rushing:"Rushing",receiving:"Receiving",kicking:"Kicking",defensive:"Defense"};
  if(!box.length){ s.appendChild(el("div","card","<div class='muted'>No box score yet.</div>")); return; }
  box.forEach(tm=>{
    const card=el("div","card"); card.appendChild(el("h2","title",tm.ab+" — Player Stats"));
    let any=false;
    want.forEach(gn=>{
      const g=tm.groups.find(x=>x.name===gn); if(!g||!g.rows.length) return; any=true;
      card.appendChild(el("div","",`<div style="font-size:12px;font-weight:700;color:var(--gold);margin:12px 0 4px">${nice[gn]||gn}</div>`));
      const wrap=el("div"); wrap.style.overflowX="auto";
      let html=`<table class="std"><tr><th>Player</th>${g.labels.map(l=>`<th>${l}</th>`).join("")}</tr>`;
      g.rows.forEach(r=>{ html+=`<tr><td style="white-space:nowrap">${r.name}</td>${r.stats.map(v=>`<td>${v}</td>`).join("")}</tr>`; });
      html+=`</table>`; wrap.innerHTML=html; card.appendChild(wrap);
    });
    if(!any) card.appendChild(el("div","muted","<div style='font-size:13px'>No stats yet.</div>"));
    s.appendChild(card);
  });
}

// ============================ BOOT ============================
async function boot(){
  try{ const { data } = await sb.auth.getSession();
    // supabase-js parses the recovery token out of the URL hash during
    // getSession() itself, so app.user is already the recovery session's
    // user by this point — no separate token handling needed.
    if(data && data.session){ app.user=data.session.user; await loadMyLeagues(); }
  }catch(e){}
  if(AUTH_RECOVERY){ app.showReset=true; try{ history.replaceState({}, "", location.pathname); }catch(e){} render(); return; }
  if(AUTH_REDIRECT){ app.showConfirm=true; try{ history.replaceState({}, "", location.pathname); }catch(e){} render(); return; }
  if(app.user && await autoRejoinLastSession()) return;
  if(app.user && await autoEnterIfSingle()) return;
  render();
}
// Restores whichever league/tab you last had open (see the localStorage
// write in render()) — checked before autoEnterIfSingle() so it also
// covers managers in 2+ leagues, not just single-league accounts. Falls
// through silently (returns false) if there's nothing saved, or the saved
// league isn't one you're still a member of (e.g. removed, or a fresh
// browser/device).
async function autoRejoinLastSession(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem("ccf_lastSession")||"null"); }catch(e){}
  if(!saved || !saved.leagueId) return false;
  const still=(app.myLeagues||[]).find(m=>m.league_id===saved.leagueId);
  if(!still) return false;
  await enterLeague(saved.leagueId, (still.leagues&&still.leagues.name)||saved.name, (still.leagues&&still.leagues.join_code)||saved.code);
  if(saved.tab) app.tab=saved.tab;
  if(saved.teamTab) app.teamTab=saved.teamTab;
  render();
  return true;
}
boot();
setInterval(tick, TICK);
</script>
