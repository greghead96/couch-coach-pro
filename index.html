<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Couch Coach Fantasy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');
  :root {
    --bg:#12201a; --panel:#1a2e22; --panel2:#24402e; --line:#436b4a;
    --ink:#0a140e; --txt:#f3ecd8; --muted:#a9baa0; --you:#3ddc84; --opp:#ff5b5b;
    --gold:#f0b429; --red:#9c3b2b; --ice:#57b6ff; --boost:#c58bff; --rare:#ffb020;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; font-family:'Nunito',-apple-system,"Segoe UI",Roboto,sans-serif; font-weight:600;
    background:radial-gradient(1100px 640px at 50% -12%, #4a5c2e 0%, var(--bg) 62%);
    color:var(--txt); padding-bottom:76px;
  }
  h1, h2.title, .brand { font-family:'Fredoka',sans-serif; }
  .app { max-width:520px; margin:0 auto; min-height:100vh; }
  header.topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:3px solid var(--ink); position:sticky; top:0;
    background:linear-gradient(180deg,#24402e,#152819); z-index:20;
  }
  header.topbar .brand { font-weight:700; font-size:17px; display:flex; gap:8px; align-items:center; }
  header.topbar .pill { font-size:11px; font-weight:800; color:var(--txt); border:2px solid var(--ink); background:var(--panel2); padding:4px 10px; border-radius:20px; box-shadow:0 2px 0 var(--ink); }
  .screen { padding:16px; }
  h2.title { font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:var(--gold); margin:0 0 12px; font-weight:700; }
  .card { background:var(--panel); border:3px solid var(--ink); border-radius:16px; padding:14px; margin-bottom:14px; box-shadow:0 4px 0 rgba(10,20,14,.55); }
  .muted { color:var(--muted); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  button { font-family:inherit; cursor:pointer; }
  .btn { background:var(--red); color:#fff; border:2px solid var(--ink); border-radius:12px; padding:10px 14px; font-weight:700; font-size:14px; font-family:'Fredoka',sans-serif; box-shadow:0 3px 0 var(--ink); }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .btn.sec { background:var(--panel2); color:var(--txt); }
  .btn.sm { padding:7px 12px; font-size:13px; box-shadow:0 2px 0 var(--ink); }
  .btn:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }

  nav.tabbar {
    position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center;
    background:linear-gradient(180deg,#1a2e22,#0f1c14); border-top:3px solid var(--ink); z-index:30;
  }
  nav.tabbar .inner { display:flex; max-width:520px; width:100%; overflow-x:auto; }
  nav.tabbar button {
    flex:1; background:none; border:none; color:var(--muted); padding:10px 2px 8px;
    font-size:9px; font-weight:800; white-space:nowrap; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabbar button .i { font-size:19px; }
  nav.tabbar button.active { color:var(--gold); }
  nav.tabbar button.active .i { transform:scale(1.12); }

  .login { display:flex; flex-direction:column; justify-content:center; min-height:100vh; padding:28px; max-width:520px; margin:0 auto; }
  .login .logo { font-size:40px; text-align:center; }
  .login h1 { text-align:center; font-size:26px; margin:6px 0 2px; }
  .login p.sub { text-align:center; color:var(--muted); margin:0 0 26px; font-size:13px; }
  .input { width:100%; background:var(--panel2); border:2px solid var(--ink); color:var(--txt);
           border-radius:10px; padding:13px 14px; font-size:15px; margin-bottom:12px; }
  .login .small { text-align:center; font-size:12px; color:var(--muted); margin-top:16px; }

  .scoreboard { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .ts { text-align:center; } .ts .nm { font-size:12px; color:var(--muted); }
  .ts .pts { font-size:38px; font-weight:800; line-height:1; } .ts.me .pts{color:var(--you);} .ts.op .pts{color:var(--opp);}
  .clock { text-align:center; padding:0 14px; }
  .clock .q { font-size:11px; color:var(--gold); font-weight:700; } .clock .tt { font-size:24px; font-weight:800; }
  .clock .st { font-size:10px; color:var(--muted); min-height:12px; }

  .plr { display:grid; grid-template-columns:30px 1fr auto; gap:9px; align-items:center;
         padding:9px 10px; border-radius:10px; background:var(--panel2); margin-bottom:8px; border:2px solid var(--ink); }
  .plr .pos { font-size:10px; font-weight:800; color:var(--txt); background:var(--ink); border-radius:6px; padding:5px 0; text-align:center; }
  .plr .nm { font-size:14px; font-weight:700; }
  .plr .meta2 { font-size:10px; color:var(--muted); min-height:11px; }
  .plr .pt { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  .plr.frozen{opacity:.55;} .plr.frozen .meta2{color:var(--ice);}
  .plr.boosted{box-shadow:0 0 0 1px var(--boost) inset;} .plr.boosted .meta2{color:var(--boost);}
  .plr.bench{opacity:.85;}
  .plr.tappable{cursor:pointer;border:1px solid var(--gold);}

  .puwrap { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .puchip { flex:0 0 auto; background:var(--panel2); border:2px solid var(--ink); border-radius:12px; box-shadow:0 3px 0 var(--ink);
            padding:9px 11px; min-width:96px; text-align:center; position:relative; }
  .puchip.armed { box-shadow:0 0 0 2px var(--gold) inset; }
  .puchip.disabled { opacity:.4; }
  .puchip .ic { font-size:20px; } .puchip .nm { font-size:11px; font-weight:700; margin-top:2px; }
  .puchip .ct { font-size:10px; color:var(--gold); margin-top:3px; }
  .puchip .cdbar { position:absolute; left:0; bottom:0; height:3px; background:var(--ice); }

  .feed { height:120px; overflow-y:auto; font-size:12px; }
  .feed .ln { padding:3px 0; border-bottom:1px solid var(--line); }
  .feed .t { color:var(--muted); margin-right:7px; }
  .ev-pu { color:var(--gold); font-weight:600; } .ev-score{color:var(--txt);}

  .tabset { display:flex; gap:8px; margin-bottom:14px; }
  .tabset button { flex:1; background:var(--panel2); border:2px solid var(--ink); color:var(--muted); font-weight:800;
                   border-radius:9px; padding:8px; font-size:12px; font-weight:600; }
  .tabset button.on { color:var(--ink); background:var(--gold); }

  table.std { width:100%; border-collapse:collapse; font-size:13px; }
  table.std th { text-align:left; color:var(--muted); font-size:10px; text-transform:uppercase; padding:6px 4px; }
  table.std td { padding:9px 4px; border-top:1px solid var(--line); }
  table.std tr.me td { color:var(--you); font-weight:700; }

  .schrow { display:flex; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .schrow .wk { color:var(--muted); width:48px; } .schrow .res.w{color:var(--you);font-weight:700;} .schrow .res.l{color:var(--opp);font-weight:700;}

  .store-item { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; }
  .store-item .ic { font-size:26px; }
  .rare-tag { font-size:9px; padding:2px 6px; border-radius:8px; background:#3a2a08; color:var(--rare); margin-left:6px; }
  .cap-bar { height:8px; background:var(--panel2); border-radius:6px; overflow:hidden; margin-top:6px; }
  .cap-bar > div { height:100%; background:var(--gold); }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .modal .box { position:relative; background:var(--panel); border:3px solid var(--ink); border-radius:18px; padding:24px; max-width:340px; text-align:center; width:100%; box-shadow:0 6px 0 rgba(5,11,30,.6); }
  .modal-x { position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; background:var(--panel2); border:2px solid var(--ink); color:var(--txt); font-weight:800; font-size:16px; line-height:26px; text-align:center; cursor:pointer; z-index:1; }
  .toast { position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--ink); border:2px solid var(--ink);
           padding:10px 18px; border-radius:24px; font-weight:700; font-size:13px; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.4); }

  /* player avatar */
  .avatar { width:34px; height:34px; min-width:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-weight:800; font-size:13px; color:#0b1020; }
  .avatar.def { background:#334155; color:var(--txt); font-size:9px; }
  .avatar.sm { width:28px; height:28px; min-width:28px; font-size:11px; }
  .avatar.img { object-fit:cover; background:#1a2e22; }

  /* side-by-side matchup rows */
  .mrow { display:grid; grid-template-columns:1fr 30px 1fr; align-items:center; gap:6px; padding:9px 0; border-top:1px solid var(--line); }
  .mrow-pos { text-align:center; font-size:10px; font-weight:800; color:var(--txt); background:var(--ink); border-radius:6px; padding:7px 0; }
  .mcell { display:flex; align-items:center; gap:8px; }
  .mcell.l { flex-direction:row-reverse; text-align:right; }
  .mcell.r { text-align:left; }
  .mcell.tappable { cursor:pointer; }
  .mcell.tappable .mc-nm { color:var(--gold); }
  .mcell.boosted .mc-pt { color:var(--boost); }
  .mc-nm { font-size:12px; font-weight:600; }
  .mc-stat { font-size:9px; color:var(--muted); }
  .mc-pt { font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }

  /* rank tag (opponent vs position) */
  .rank { font-size:9px; font-weight:800; padding:2px 6px; border-radius:6px; }

  /* filter chips */
  .chips { display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; }
  .chip { flex:0 0 auto; background:var(--panel2); border:2px solid var(--ink); color:var(--muted); font-weight:800;
          border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .chip.on { color:var(--ink); background:var(--gold); }

  /* playoff bracket */
  .bracket { display:flex; gap:12px; overflow-x:auto; padding:6px 0 2px; }
  .bround { display:flex; flex-direction:column; justify-content:space-around; gap:12px; min-width:150px; }
  .bround h4 { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:0 0 2px; text-align:center; }
  .bmatch { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:11px; }
  .bmatch .bt { padding:3px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bmatch .bt.me { color:var(--you); font-weight:700; }

  /* ---- responsive: scale up on tablet / desktop ---- */
  @media (min-width:700px){
    .app { max-width:720px; }
    nav.tabbar .inner { max-width:720px; }
    .card { padding:16px 18px; }
    .login { max-width:560px; }
  }
  @media (min-width:1000px){
    .app { max-width:960px; }
    nav.tabbar .inner { max-width:960px; }
    nav.tabbar button { font-size:12px; padding:12px 4px 10px; }
    nav.tabbar button .i { font-size:23px; }
    .screen { padding:22px; }
    h1 { font-size:28px; }
    h2.title { font-size:15px; }
    .card { padding:18px 22px; border-radius:16px; margin-bottom:16px; }
    .btn { font-size:15px; padding:12px 16px; }
    .btn.sm { font-size:14px; padding:8px 14px; }
    .input { font-size:16px; padding:14px 16px; }
    .avatar { width:40px; height:40px; min-width:40px; font-size:15px; }
    .avatar.sm { width:32px; height:32px; min-width:32px; }
    .plr { padding:11px 13px; }
    .plr .nm { font-size:15px; } .plr .meta2 { font-size:11px; } .plr .pt { font-size:20px; } .plr .pos { font-size:11px; }
    .ts .nm { font-size:13px; } .ts .pts { font-size:46px; } .clock .tt { font-size:28px; } .clock .q { font-size:12px; }
    .mc-nm { font-size:14px; } .mc-stat { font-size:10px; } .mc-pt { font-size:18px; } .mrow-pos { font-size:11px; padding:9px 0; }
    table.std { font-size:15px; } table.std th { font-size:11px; } table.std td { padding:11px 6px; }
    .puchip { min-width:118px; padding:12px 14px; } .puchip .nm { font-size:12px; } .puchip .ic { font-size:24px; }
    .chip { font-size:13px; padding:7px 14px; }
    .feed { height:160px; font-size:13px; }
    .schrow { font-size:14px; padding:13px 6px; }
    .dboard.big .dcell { min-height:66px; } .dboard.big .dcell .pn { font-size:13px; } .dboard.big .dhead { font-size:12px; }
    .rank { font-size:10px; }
  }
  @media (min-width:1400px){
    .app { max-width:1040px; }
    nav.tabbar .inner { max-width:1040px; }
  }

  /* sleeper-style draft board */
  .dboard { overflow-x:auto; padding-bottom:8px; margin-bottom:14px; }
  .dgrid { display:grid; gap:4px; }
  .dhead { font-size:9px; color:var(--muted); text-align:center; font-weight:700; white-space:nowrap; padding:3px 2px; }
  .dhead.me { color:var(--you); }
  .dcell { background:var(--panel2); border:1px solid var(--line); border-radius:6px; min-height:42px; padding:4px 5px; overflow:hidden; }
  .dcell.empty { opacity:.35; }
  .dcell.now { box-shadow:0 0 0 2px var(--gold) inset; }
  .dcell .pk { color:var(--muted); font-size:8px; }
  .dcell .pn { font-weight:700; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* enlarged draft board */
  .dboard.big .dhead { font-size:11px; padding:5px 3px; }
  .dboard.big .dcell { min-height:58px; padding:6px; }
  .dboard.big .dcell .pk { font-size:9px; }
  .dboard.big .dcell .pn { font-size:12px; }
</style>
</head>

  b.textContent="🔄 A new version of Couch Coach is ready — tap to update";
  b.onclick=()=>location.reload();

async function checkForUpdate(){
  try{
    const r=await fetch(location.pathname+"?_cb="+Date.now(), {cache:"no-store"});

    const m=txt.match(/const BUILD_ID\s*=\s*"([^"]+)"/);
    if(m && m[1]!==BUILD_ID) showUpdateBanner();

}

// ============================ SIM LOOP ============================
function tick(){
  if(app.realLeague) return; // real leagues are driven by polled ESPN data, not a local clock
  if(!app.user || app.tab!=="matchup" || !app.sim || !app.sim.running) return;
  const adv = BASE_SPD*app.sim.speed*(TICK/1000);
  const prev = app.sim.gameSec;
  app.sim.gameSec = Math.min(4*QSEC, app.sim.gameSec+adv);
  if(Math.floor(prev/QSEC)!==Math.floor(app.sim.gameSec/QSEC) && app.sim.gameSec<4*QSEC)
    feed(`— End of Q${Math.floor(app.sim.gameSec/QSEC)} —`,"ev-score");

  maybeOpponentAI(adv);

  // quarter transitions: announce activations for the new quarter, resolve Hail Mary penalties for the one that ended
  const curQ = app.sim.gameSec>=4*QSEC ? 5 : Math.min(4,Math.floor(app.sim.gameSec/QSEC)+1);
  if(curQ > (app.sim.curQ||0)){
    for(let qq=(app.sim.curQ||0)+1; qq<=Math.min(curQ,4); qq++){
      app.sim.scheduled.filter(x=>x.q===qq).forEach(x=>{
        const p=findPlayer(x.pid), cfg=POWERUPS[x.key];
        feed(`Q${qq}: ${cfg.icon} ${cfg.name} on ${p?p.name:"?"}`,"ev-pu");
      });
    }
    app.sim.curQ=curQ;
  }

  const q = Math.min(4,Math.floor(app.sim.gameSec/QSEC)+1);
  [...myStarters,...oppStarters,...myBench,...oppBench].forEach(p=>{
    const eff=effectsFor(p,q);
    if(eff.frozen) return;
    const c=POS_CFG[p.pos]; if(!c) return;
    const chance = c.rate*(adv/30);
    if(Math.random()<chance){
      let g = c.min+Math.random()*(c.max-c.min);
      const mult = eff.double?2:1;
      g*=mult; g=Math.round(g*10)/10;
      const qualTD = addStat(p, g);
      p.pts=Math.round((p.pts+g)*10)/10;
      const m=mult>1?` (${mult}×)`:""; feed(`${p.name} +${g}${m}`,"ev-score");
      // Hot Start: first rush/rec TD in YOUR lineup this game — if it's your pick, 3× that TD
      if(qualTD && myStarters.includes(p) && !app.sim.firstTD){
        app.sim.firstTD={pid:p.id, t:app.sim.gameSec};
        if(app.sim.hotStart===p.id){
          const bonus=2*(app.settings.scoring.rushTD||6);
          p.pts=Math.round((p.pts+bonus)*10)/10;
          feed(`🔥 HOT START! ${p.name} scored your lineup's fastest TD — 3× (+${bonus})`,"ev-pu");
        } else if(app.sim.hotStart){
          const hp=findPlayer(app.sim.hotStart);
          feed(`🔥 Hot Start missed — ${(hp&&hp.name)||"your pick"} didn't get the fastest TD.`,"ev-pu");
        }
      }
    }
  });

  // other league games tick live too
  app.sim.others.forEach(m=>{
    if(Math.random()<0.35*(adv/5)) m.as=Math.round((m.as+Math.random()*1.3)*10)/10;
    if(Math.random()<0.35*(adv/5)) m.bs=Math.round((m.bs+Math.random()*1.3)*10)/10;
  });

  if(app.sim.gameSec>=4*QSEC){ app.sim.running=false;
    const ms=myTeamScore(), os=oppTeamScore();
    feed(`FINAL — ${ms>os?"🏆 You WIN!":ms<os?"💀 You lose.":"🤝 Tie."}`,"ev-pu"); }
  if(app.tab==="matchup") renderMatchup();
}

    // simulated kickoff/pause/reset controls aren't shown for real leagues),
    // so checking them here never actually blocked a live real player.
    const started = app.realLeague ? realCurrentQuarterFor(p)>0 : (app.sim.gameSec>0 || app.sim.running);
    if(started){ toast("Set Hot Start before "+p.name+"'s game kicks off"); return; }
    if(playerAssigned(p.id)){ toast(p.name+" already has a power-up this week"); return; }
    app.inv.hotstart--; app.sim.hotStart=p.id; app.armed=null;
    logPU("me","hotstart",p.name,false,1);
    feed(`🔥 Hot Start set on ${p.name} — 3× on your lineup's fastest TD.`,"ev-pu");
    if(app.realLeague) persistPowerup("hotstart",p.id,p.name,1);
    toast("Hot Start: "+p.name); renderMatchup(); return;
  }
  if(k==="sub"){
    const cq=app.realLeague ? realCurrentQuarterFor(p) : currentQuarter();
    if(cq<1 || cq>2){ toast(app.realLeague?"Emergency Sub: only while that player's real game is in Q1-Q2":"Emergency Sub: first half of a live game only"); return; }
    openSubModal(p); return;
  }
  // Double / Freeze — one power-up per player per week
  if(playerAssigned(p.id)){ toast(p.name+" already has a power-up this week"); app.armed=null; renderMatchup(); return; }
  const cq=app.realLeague ? realCurrentQuarterFor(p) : currentQuarter();
  const allowed=[]; for(let q=1;q<=4;q++) if(q>cq) allowed.push(q);
  if(!allowed.length){ toast("No upcoming quarters left"); app.armed=null; renderMatchup(); return; }
  showQuarterPicker(k,p,allowed);
}
function openSubModal(starter){
  const ov=$("overlay");
  const si=myStarters.indexOf(starter);
  const slot=SLOTS[si]; // same eligibility rule as setting a lineup slot — FLEX allows RB/WR/TE, everything else must match exactly
  const eligible=myBench.map((p,i)=>({p,i})).filter(o=>!slot || slot.pos.includes(o.p.pos));
  const list=eligible.map(o=>`<button class="btn sec subOpt" data-i="${o.i}" style="width:100%;text-align:left;margin-top:6px">${o.p.pos} · ${o.p.name} <span class="muted" style="font-size:11px">· not kicked off</span></button>`).join("");
  ov.innerHTML=`<div class="modal"><div class="box" style="max-width:360px">
    <div style="font-weight:800">🔁 Emergency Sub</div>
    <div class="muted" style="font-size:12px;margin:6px 0 8px">Sub in for <b style="color:var(--txt)">${starter.name}</b> (${starter.pos}, game underway). Pick a ${slot?slot.pos.join("/"):starter.pos} on your bench who hasn't kicked off — they start fresh:</div>
    <div style="max-height:46vh;overflow:auto">${list||'<div class="muted">No eligible bench players at this position.</div>'}</div>
    <button class="btn sec" id="subCancel" style="width:100%;margin-top:12px">Cancel</button></div></div>`;
  ov.querySelectorAll(".subOpt").forEach(b=> b.onclick=()=>{
    const bp=myBench[+b.dataset.i];
    const bi=myBench.indexOf(bp);
    reset(bp);
    myStarters[si]=bp; myBench[bi]=starter;
    app.inv.sub--; app.armed=null; $("overlay").innerHTML="";
    feed(`🔁 Emergency Sub — ${bp.name} in for ${starter.name} (fresh game)!`,"ev-pu");
    const subQ=currentQuarter();
    logPU("me","sub",bp.name,false,subQ);
    if(app.realLeague) persistPowerup("sub",bp.id,bp.name,subQ,starter.id);
    toast("Subbed in "+bp.name); renderMatchup();
  });
  ov.querySelector("#subCancel").onclick=()=>{ $("overlay").innerHTML=""; app.armed=null; renderMatchup(); };
}
function showQuarterPicker(k,p,allowed){
  const cfg=POWERUPS[k]; const ov=$("overlay");

function schedulePU(k,p,q){
  const cfg=POWERUPS[k];

  feed(`${cfg.icon} ${cfg.name} scheduled on ${p.name} for Q${q}.`,"ev-pu");
  toast(`${cfg.name} set for Q${q}`);
  if(app.realLeague) persistPowerup(k,p.id,p.name,q);
  renderMatchup();
}


// ============================ RENDER: SHELL ============================
function render(){
  if(app.showReset){ renderResetPassword(); return; }
  if(app.showConfirm){ renderConfirm(); return; }
  if(!app.user){ renderAuth(); return; }
  if(!app.connectedLeague){ renderLeaguePicker(); return; }
  // Persist which league/tab you're on so a page refresh (or the mid-draft
  // auto-update reload) drops you back where you were instead of always
  // back at the league picker — matters most for anyone in 2+ leagues,
  // since autoEnterIfSingle() only auto-rejoins when there's exactly one.
  try{ localStorage.setItem("ccf_lastSession", JSON.stringify({
    leagueId:app.sbLeagueId, name:app.connectedLeague, code:app.leagueCode,
    tab:app.tab, teamTab:app.teamTab })); }catch(e){}
  // render() is a full teardown/rebuild of the whole app div, and realtime
  // events (live scoring, other managers' actions) call it from anywhere,
  // including mid-keystroke in a search box — without this, a background
  // score update while typing silently drops focus after every letter.
  // Only text inputs with a stable id (search boxes below) are restorable;
  // untouched otherwise.
  const activeEl=document.activeElement;
  const appEl=$("app");
  const focusId = (activeEl && activeEl.id && appEl && appEl.contains(activeEl)) ? activeEl.id : null;
  const selStart = focusId && activeEl.selectionStart!=null ? activeEl.selectionStart : null;
  const selEnd = focusId && activeEl.selectionEnd!=null ? activeEl.selectionEnd : null;
  $("app").innerHTML="";
  const top=el("header","topbar");
  top.innerHTML=`<div class="brand">🛋️ Couch Coach</div>
    <div style="display:flex;align-items:center;gap:9px">
      <button id="acctBtn" class="pill" style="background:none;cursor:pointer;color:var(--txt)">👤</button>
      <button id="bellBtn" class="pill" style="background:none;cursor:pointer;color:var(--gold)">🔔</button>
      ${app.isCommish?`<button id="commishBtn" class="pill" style="background:none;cursor:pointer;${app.tab==='commish'?'color:#1a1300;background:var(--gold);border-color:var(--gold)':'color:var(--gold)'}">⚙️ Commish</button>`:""}
    </div>`;
  $("app").appendChild(top);
  const cb=top.querySelector("#commishBtn"); if(cb) cb.onclick=()=>{ app.tab="commish"; app.armed=null; render(); };
  top.querySelector("#bellBtn").onclick=()=>{ app.tab="home"; app.armed=null; render(); };
  top.querySelector("#acctBtn").onclick=accountModal;
  const scr=el("div"); scr.id="screen"; scr.className="screen"; $("app").appendChild(scr);
  if(app.tab!=="nfl") stopPoll();
  renderTab();
  renderNav();
  if(focusId){
    const restored=document.getElementById(focusId);
    if(restored && restored.focus){ restored.focus();
      if(selStart!=null && restored.setSelectionRange){ try{ restored.setSelectionRange(selStart, selEnd); }catch(e){} } }
  }
}
function renderNav(){
  const tabs=[["home","Home","🏟️"],["nfl","NFL Live","🏈"],["matchup","Matchup","🥊"],["team","My Team","📋"],
              ["players","Players","🔁"],["draft","Draft","🐍"],["league","League","🏆"],["store","Power-Ups","⚡"]];
  let nav=$("nav"); if(nav) nav.remove();
  nav=el("nav","tabbar"); nav.id="nav";
  const inner=el("div","inner");
  tabs.forEach(([id,label,ic])=>{
    const b=el("button",app.tab===id?"active":"",`<span class="i">${ic}</span>${label}`);
    b.onclick=()=>{ app.tab=id; app.armed=null; render(); };
    inner.appendChild(b);
  });
  nav.appendChild(inner); document.body.appendChild(nav);
}
function renderTab(){
  // keep the shared roster/score globals fresh regardless of which tab is
  // showing them (Home, League > Scoreboard, and Matchup all read the same
  // myStarters/oppStarters — so this can't be gated to the Matchup tab alone)
  if(app.realLeague && app.user){
    const key=matchupSetupKey();
    if(app._matchupSetupKey!==key){ app._matchupSetupKey=key; setupRealMatchup(); app.sim=freshSim(); }
    syncRealPointsToPlayers(); refreshRealInv();
    if(app.tab==="matchup") startStatsPoll();
  }
  if(app.tab==="home") renderHome();
  else if(app.tab==="nfl"){ ensureNFL(); renderNFL(); }
  else if(app.tab==="matchup") renderMatchup();
  else if(app.tab==="team") renderTeam();
  else if(app.tab==="players"){ ensurePool(); renderPlayers(); }
  else if(app.tab==="draft"){ ensurePool(); renderDraft(); }
  else if(app.tab==="league") renderLeague();
  else if(app.tab==="store") renderStore();
  else if(app.tab==="viewteam") renderViewTeam();
  else if(app.tab==="commish"){ if(app.isCommish) renderCommish(); else { app.tab="home"; renderHome(); } }
}

  const a=$("app"); a.innerHTML="";

  const w=el("div","login");
  if(forgot){
    w.innerHTML=`

      ${app.authErr?`<div class="small" style="color:var(--opp);text-align:left">${app.authErr}</div>`:""}
      <button class="btn" id="authBtn"${app.authBusy?" disabled":""}>${app.authBusy?"…":"Send Reset Link"}</button>
      <div class="small"><b id="toggleAuth" style="color:var(--gold);cursor:pointer">← Back to log in</b></div>`;
    a.appendChild(w);
    w.querySelector("#toggleAuth").onclick=()=>{ app.authMode="login"; app.authErr=""; app.authMsg=""; render(); };

      if(!em){ app.authErr="Email required."; app.authMsg=""; render(); return; }
      app.authBusy=true; app.authErr=""; app.authMsg=""; render();
      try{
        const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin+location.pathname });
        if(error) throw error;
        app.authBusy=false; app.authMsg="Check your email for a password reset link.";
        render();
      }catch(e){ app.authBusy=false; app.authErr=friendlyAuthError(e); render(); }
    };
    return;
  }
  w.innerHTML=`
    <div class="logo">🛋️</div>
    <h1>Couch Coach Fantasy</h1>
    <p class="sub">Fantasy football with power-ups.</p>
    ${signup?`<input class="input" id="dn" placeholder="Display name"/>`:""}
    <input class="input" id="em" type="email" placeholder="Email" autocomplete="email"/>
    <input class="input" id="pw" type="password" placeholder="Password (6+ chars)" autocomplete="${signup?'new-password':'current-password'}"/>
    ${!signup?`<div class="small" style="text-align:right"><b id="forgotLink" style="color:var(--gold);cursor:pointer">Forgot password?</b></div>`:""}
    ${app.authMsg?`<div class="small" style="color:var(--you);text-align:left">${app.authMsg}</div>`:""}
    ${app.authErr?`<div class="small" style="color:var(--opp);text-align:left">${app.authErr}</div>`:""}
    <button class="btn" id="authBtn"${app.authBusy?" disabled":""}>${app.authBusy?"…":(signup?"Sign Up":"Log In")}</button>
    <div class="small">${signup?"Have an account?":"New here?"} <b id="toggleAuth" style="color:var(--gold);cursor:pointer">${signup?"Log in":"Sign up free"}</b></div>`;
  a.appendChild(w);
  w.querySelector("#toggleAuth").onclick=()=>{ app.authMode=signup?"login":"signup"; app.authErr=""; app.authMsg=""; render(); };
  const forgotLink=w.querySelector("#forgotLink");
  if(forgotLink) forgotLink.onclick=()=>{ app.authMode="forgot"; app.authErr=""; app.authMsg=""; render(); };
  w.querySelector("#authBtn").onclick=async ()=>{
    const em=(w.querySelector("#em").value||"").trim(), pw=w.querySelector("#pw").value||"";
    const dn=signup?((w.querySelector("#dn").value||"").trim()):"";
    if(!em||!pw){ app.authErr="Email and password required."; app.authMsg=""; render(); return; }
    app.authBusy=true; app.authErr=""; app.authMsg=""; render();
    try{
      if(signup){
        const { data, error } = await sb.auth.signUp({ email:em, password:pw, options:{ data:{ display_name:dn||em.split("@")[0] } } });
        if(error) throw error;
        if(!data.session){ app.authBusy=false; app.authMode="login"; app.authMsg="Account created! Check your email for the confirmation link, then log in."; render(); return; }
        app.user=data.user;
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email:em, password:pw });
        if(error) throw error; app.user=data.user;
      }
      await loadMyLeagues(); app.authBusy=false;
      if(!(await autoEnterIfSingle())) render();
    }catch(e){ app.authBusy=false; app.authErr=friendlyAuthError(e); render(); }
  };
}
function friendlyAuthError(e){
  const m=((e&&e.message)||"").toLowerCase();
  if(m.includes("invalid login") || m.includes("invalid credentials") || m.includes("invalid email or password")) return "Incorrect username or password.";
  if(m.includes("already registered") || m.includes("already exists")) return "An account with that email already exists — try logging in instead.";
  if(m.includes("email not confirmed")) return "Check your email for the confirmation link before logging in.";
  if(m.includes("load failed") || m.includes("failed to fetch") || m.includes("network")) return "Couldn't reach the server — check your connection and try again.";
  if(m.includes("session missing") || m.includes("not authenticated") || m.includes("auth session")) return "This reset link has expired — request a new one from the login page.";
  return "Incorrect username or password.";
}
async function loadMyLeagues(){

// Pull the selected league's real members into the app (real team names replace the mock roster)
async function loadLeagueData(){
  try{
    const { data } = await sb.from("league_members").select("user_id, team_name, role").eq("league_id", app.sbLeagueId);
    const members=(data||[]);
    const me=members.find(m=>m.user_id===app.user.id);
    app.myTeam=(me&&me.team_name)||"My Team";
    app.isCommish=!!(me && me.role==="commissioner");
    app.members=members;
    app.schedTeam=app.myTeam;
    const others=members.filter(m=>m.user_id!==app.user.id);
    app.oppTeam=others.length ? (others[0].team_name||"Opponent") : "(waiting for opponents)";
    LEAGUE.length=0;
    members.forEach(m=> LEAGUE.push({ team:m.team_name||"Team", w:0, l:0, pf:0, pa:0, streak:"—", pu:0, me:m.user_id===app.user.id }));
    // Usernames — shown alongside team names (Standings, Matchup) since a
    // team name rarely tells you who you're actually playing.
    try{ const { data:profs } = await sb.from("profiles").select("id, display_name").in("id", members.map(m=>m.user_id));
      app.profiles={}; (profs||[]).forEach(p=>{ app.profiles[p.id]=p.display_name; });
    }catch(e){ app.profiles={}; }
    // load persisted league settings
    try{ const { data:lg } = await sb.from("leagues").select("settings, last_waiver_process, waiver_priority, waiver_priority_week, current_week, standings_cache").eq("id", app.sbLeagueId).maybeSingle();
      if(lg && lg.settings){ ["scoring","league"].forEach(k=>{ if(lg.settings[k]) app.settings[k]={...app.settings[k], ...lg.settings[k]}; }); }
      if(app.settings.league.waiver==="FAAB") app.settings.league.waiver="Reverse standings"; // FAAB retired
      if(lg){ app.leagueLastWaiverProcess=lg.last_waiver_process?new Date(lg.last_waiver_process).getTime():0;
        app.leagueWaiverPriority=lg.waiver_priority||[]; app.leagueStandingsCache=lg.standings_cache||[];
        app.leagueWaiverPriorityWeek=lg.waiver_priority_week; app.leagueCurrentWeek=lg.current_week; }
    }catch(e){}
    app.realLeague=true;
  }catch(e){ app.realLeague=false; }
}

// ============================ MATCHUP ============================
function renderMatchup(){
  syncRealPointsToPlayers();
  const s=$("screen"); if(!s) return; s.innerHTML="";
  const others = app.realLeague ? realOtherMatchups(app.currentWeek||1) : (app.sim.others||[]);
  const all = [{your:true, a:app.myTeam, b:app.oppTeam, uidA:app.user&&app.user.id, uidB:weekOpponent()}, ...others.map(m=>({your:false, ...m}))];
  if(app.matchupIdx>=all.length) app.matchupIdx=0;
  const idx=app.matchupIdx; const m=all[idx];
  const done=app.sim.gameSec>=4*QSEC;
  const {q,rem}=clk();

  // matchup navigation
  const nav=el("div","row"); nav.style.marginBottom="12px";
  const prev=el("button","btn sec","‹"); prev.style.padding="10px 16px";
  const next=el("button","btn sec","›"); next.style.padding="10px 16px";
  prev.onclick=()=>{ app.matchupIdx=(idx-1+all.length)%all.length; app.armed=null; renderMatchup(); };
  next.onclick=()=>{ app.matchupIdx=(idx+1)%all.length; app.armed=null; renderMatchup(); };
  const label=el("div","",`<div style="text-align:center">
    <div style="font-size:13px;font-weight:700">${m.your?"🏈 Your Matchup":"🔭 Spectating"}</div>
    <div class="muted" style="font-size:11px">Matchup ${idx+1} of ${all.length}</div></div>`);
  label.style.flex="1";
  nav.append(prev,label,next); s.appendChild(nav);

  // scoreboard (works for your game or a spectated one)
  const lp = m.your ? myTeamScore() : m.as;
  const rp = m.your ? oppTeamScore() : m.bs;
  const sb=el("div","card");
  const rgs = (app.realLeague && m.your) ? realGameStatusSummary() : null;
  const clockHtml = rgs
    ? `<div class="q">${rgs.total===0?"NO GAMES":rgs.final===rgs.total?"FINAL":rgs.live>0?"🔴 LIVE":"UPCOMING"}</div>
       <div class="tt" style="font-size:12px">${rgs.live} live · ${rgs.final} final</div>
       <div class="st">${m.your&&app.armed?"⚠ pick target":(rgs.upcoming)+" upcoming"}</div>`
    : app.realLeague
    ? `<div class="q">WK ${app.currentWeek||1}</div><div class="st">league game</div>`
    : `<div class="q">${app.sim.gameSec===0&&!app.sim.running?"PREGAME":done?"FINAL":"Q"+q}</div>
       <div class="tt">${done?"0:00":fmt(rem)}</div>
       <div class="st">${done?"Final":app.sim.running?(m.your&&app.armed?"⚠ pick target":"LIVE"):"Paused"}</div>`;
  const unameA = (app.realLeague && m.uidA) ? usernameOf(m.uidA) : "";
  const unameB = (app.realLeague && m.uidB) ? usernameOf(m.uidB) : "";
  const meUid=app.user&&app.user.id;
  const nmA = (app.realLeague && m.uidA && m.uidA!==meUid) ? `<span data-uid="${m.uidA}" style="cursor:pointer;text-decoration:underline dotted">${m.a}</span>` : m.a;
  const nmB = (app.realLeague && m.uidB && m.uidB!==meUid) ? `<span data-uid="${m.uidB}" style="cursor:pointer;text-decoration:underline dotted">${m.b}</span>` : m.b;
  sb.innerHTML=`<div class="scoreboard">
    <div class="ts me"><div class="nm">${nmA}${unameA?` <span class="muted" style="font-size:11px">(${unameA})</span>`:""}</div><div class="pts">${lp.toFixed(1)}</div></div>
    <div class="clock">${clockHtml}</div>
    <div class="ts op"><div class="nm">${nmB}${unameB?` <span class="muted" style="font-size:11px">(${unameB})</span>`:""}</div><div class="pts">${rp.toFixed(1)}</div></div>
  </div>`;
  sb.querySelectorAll("[data-uid]").forEach(el2=> el2.onclick=()=>openViewTeam(el2.dataset.uid));
  s.appendChild(sb);

  // Spectator view — read-only, no power-ups
  if(!m.your){
    const lead = lp>rp ? `${m.a} leads by ${(lp-rp).toFixed(1)}` : rp>lp ? `${m.b} leads by ${(rp-lp).toFixed(1)}` : "All tied up";
    s.appendChild(el("div","card",`<div style="text-align:center;font-weight:700;font-size:15px">${lead}</div>
      <div class="muted" style="font-size:12px;text-align:center;margin-top:6px">🔭 Spectating — power-ups can only be used in your own matchup.</div>`));
    if(app.realLeague && m.uidA && m.uidB){
      const wk=app.currentWeek||1;
      const aRoster=startersForUser(m.uidA, app.lineupsByUser[m.uidA]);
      const bRoster=startersForUser(m.uidB, app.lineupsByUser[m.uidB]);
      [...aRoster.startersOut,...aRoster.bench,...bRoster.startersOut,...bRoster.bench].forEach(p=>{ if(p.id) p.pts=playerWeekScore(p.id,wk)||0; });
      s.appendChild(matchupLineups(aRoster.startersOut,bRoster.startersOut,"Starters",false,m.a,m.b));
      s.appendChild(matchupLineups(aRoster.bench,bRoster.bench,"Bench",false,m.a,m.b));
    }
    const jump=el("button","btn sec"); jump.style.width="100%"; jump.textContent="← Back to my matchup";
    jump.onclick=()=>{ app.matchupIdx=0; renderMatchup(); };
    s.appendChild(jump);
    return;
  }

  s.appendChild(el("div","muted",`<div style='font-size:11px;margin:-2px 0 12px;text-align:center'>${app.realLeague?("🗓️ <b>Week "+(app.currentWeek||1)+"</b> · your lineup vs "+app.oppTeam+" — "):""}🏆 <b style='color:var(--gold)'>CCF Score</b> = points + power-ups. ⏱️ Power-ups scheduled <b style='color:var(--gold)'>by quarter</b>. <span style='opacity:.7'>Simulated preview until live scoring.</span></div>`));

  if(!app.realLeague){
    const ctl=el("div","row"); ctl.style.marginBottom="14px";
    const start=el("button","btn", app.sim.running?"⏸ Pause":(app.sim.gameSec>0?"▶ Resume":"▶ Kick Off"));
    start.onclick=()=>{ if(app.sim.gameSec>=4*QSEC)return; app.sim.running=!app.sim.running;
      if(app.sim.running&&app.sim.gameSec===0)feed("Kickoff! Live.","ev-pu"); renderMatchup(); };
    const spd=el("button","btn sec","⏩ "+app.sim.speed+"x");
    spd.onclick=()=>{ const a=[1,2,4]; app.sim.speed=a[(a.indexOf(app.sim.speed)+1)%3]; renderMatchup(); };
    const rs=el("button","btn sec","↺ Reset");
    rs.onclick=()=>{ app.sim=freshSim(); app.armed=null; renderMatchup(); };
    ctl.append(start,spd,rs);
    s.appendChild(ctl);
  }

  if(done && app.sim.puLog.length) s.appendChild(recapCard());

  const trayCard=el("div","card");
  trayCard.appendChild(el("h2","title","Power-Ups — arm one, then tap a player"));
  const tray=el("div","puwrap");
  Object.entries(POWERUPS).forEach(([k,cfg])=>{
    const have=app.inv[k]||0;
    const dis = have<=0;
    const chip=el("div","puchip"+(app.armed===k?" armed":"")+(dis?" disabled":""));
    chip.innerHTML=`<div class="ic">${cfg.icon}</div><div class="nm">${cfg.name}</div><div class="ct">x${have}</div>`;
    chip.onclick=()=>{ if(!dis) armPU(k); };
    tray.appendChild(chip);
  });
  trayCard.appendChild(tray);
  const armedHint = app.armed==="hotstart" ? "Tap one of YOUR starters — set before kickoff."
    : app.armed==="sub" ? "Tap the STARTER to replace (first half only)."
    : app.armed==="freeze" ? "Tap an OPPONENT, then pick a quarter."
    : app.armed==="double" ? "Tap one of YOUR starters, then pick a quarter." : "";
  if(armedHint) trayCard.appendChild(el("div","muted",`<div style='font-size:12px;margin-top:8px;color:var(--gold)'>⚠ ${armedHint}</div>`));
  else if(Object.values(app.inv).every(v=>v<=0))
    trayCard.appendChild(el("div","muted","<div style='font-size:12px;margin-top:8px'>Out of power-ups — earn more in the ⚡ Power-Ups tab.</div>"));
  if(app.sim.hotStart){ const hp=findPlayer(app.sim.hotStart);
    trayCard.appendChild(el("div","muted",`<div style='font-size:12px;margin-top:8px'>🔥 Hot Start: <b style="color:var(--txt)">${(hp&&hp.name)||"—"}</b>${app.sim.firstTD?(app.sim.firstTD.pid===app.sim.hotStart?" — hit! 3× applied":" — missed (someone scored first)"):" — awaiting first TD"}</div>`)); }
  s.appendChild(trayCard);

  if(app.sim.scheduled.length){
    const cq=currentQuarter();
    const sc=el("div","card"); sc.appendChild(el("h2","title","Scheduled This Game"));
    app.sim.scheduled.slice().sort((a,b)=>a.q-b.q).forEach(x=>{
      const p=findPlayer(x.pid), cfg=POWERUPS[x.key];
      const state = x.q<cq?"done":(x.q===cq&&cq>=1&&cq<=4?"🔴 LIVE":"upcoming");
      sc.appendChild(el("div","",`<div style="padding:7px 0;border-top:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:8px">
        <span>${cfg.icon} <b>${cfg.name}</b> · ${p?p.name:"?"} <span class="muted" style="font-size:11px">(${x.by==='me'?'you':'opp'})</span></span>
        <span class="muted" style="white-space:nowrap">Q${x.q} · ${state}</span></div>`));
    });
    s.appendChild(sc);
  }

  s.appendChild(matchupLineups(myStarters,oppStarters,"Starters",true));
  s.appendChild(matchupLineups(myBench,oppBench,"Bench",false));
}
function matchupLineups(myArr,opArr,title,allowTap,labelA,labelB){
  const c=el("div","card");
  const head=el("div","row"); head.style.marginBottom="4px";
  head.innerHTML=`<span style="color:var(--you);font-size:12px;font-weight:700">${labelA||"Your"} ${title}</span>
    <span class="muted" style="font-size:10px">vs</span>
    <span style="color:var(--opp);font-size:12px;font-weight:700">${labelB||"Their"} ${title}</span>`;
  c.appendChild(head);
  const armedCfg=(allowTap && app.armed)?POWERUPS[app.armed]:null;
  const cq=currentQuarter();
  const n=Math.max(myArr.length,opArr.length);
  for(let i=0;i<n;i++){
    const lp=myArr[i], rp=opArr[i];
    const pos=(lp&&lp.pos)||(rp&&rp.pos)||"";
    const row=el("div","mrow");
    row.appendChild(playerCell(lp,"me",armedCfg,cq,true));
    const mid=el("div","mrow-pos"); mid.textContent=pos; row.appendChild(mid);
    row.appendChild(playerCell(rp,"op",armedCfg,cq,false));
    c.appendChild(row);
  }
  return c;
}
function playerCell(p,side,armedCfg,cq,leftSide){
  const cell=el("div","mcell "+(leftSide?"l":"r"));
  if(!p){ cell.innerHTML="<span class='muted'>—</span>"; return cell; }
  const isEmptySlot = !p.id || p.id.indexOf("e_")===0;
  const tappable=armedCfg && armedCfg.target===side && !isEmptySlot;
  let sched=app.sim.scheduled.filter(x=>x.pid===p.id);
  let hotOn = app.sim.hotStart===p.id;
  if(app.realLeague && !sched.length){
    const persisted=app.powerupPicks.filter(x=>x.week===app.currentWeek && x.player_id===p.id && x.powerup_key!=="hotstart");
    sched=persisted.map(x=>({key:x.powerup_key,pid:p.id,q:x.quarter}));
    if(!hotOn) hotOn=app.powerupPicks.some(x=>x.week===app.currentWeek && x.player_id===p.id && x.powerup_key==="hotstart");
  }
  const activeNow = cq>=1 && cq<=4 && sched.some(x=>Number(x.q)===cq);
  if(tappable) cell.classList.add("tappable");
  if(activeNow) cell.classList.add("boosted");
  const hot = hotOn ? "🔥" : "";
  const tags=[hot, ...sched.map(x=>POWERUPS[x.key].icon+"Q"+x.q)].filter(Boolean).join(" ");

// Per-quarter stat + power-up breakdown, tap a player's FP to open — like
// ESPN's box score, but also shows exactly which quarter a power-up hit.
// Line-item stat breakdown for one quarter, e.g. "2 sacks (1pt each)" → 2.0.
// Points allowed is NOT included here — it's a whole-game stat, shown separately.
function quarterStatLines(pos, stats){
  const sc=app.settings.scoring; const lines=[]; if(!stats) return lines;
  const push=(n,label,per,pts)=>{ if(n) lines.push({label:`${n} ${label}${n!==1?"s":""} (${per})`, pts}); };
  if(pos==="DEF"){
    push(stats.sacks,"sack",`${sc.sack||1}pt each`, stats.sacks*(sc.sack||1));
    push(stats.ints,"INT",`${sc.defInt||2}pts each`, stats.ints*(sc.defInt||2));
    push(stats.defTD,"TD",`${sc.defTD||6}pts each`, stats.defTD*(sc.defTD||6));
  } else if(pos==="K"){
    push(stats.fgMade0_39,"FG (0-39yd)",`${sc.fg0_39||3}pts each`, stats.fgMade0_39*(sc.fg0_39||3));
    push(stats.fgMade40_49,"FG (40-49yd)",`${sc.fg40_49||4}pts each`, stats.fgMade40_49*(sc.fg40_49||4));
    push(stats.fgMade50p,"FG (50+yd)",`${sc.fg50p||5}pts each`, stats.fgMade50p*(sc.fg50p||5));
    push(stats.fgMissed,"missed FG",`${sc.fgMiss!=null?sc.fgMiss:-1}pts each`, stats.fgMissed*(sc.fgMiss!=null?sc.fgMiss:-1));
    push(stats.xpMade,"XP made",`${sc.xp!=null?sc.xp:1}pt each`, stats.xpMade*(sc.xp!=null?sc.xp:1));
    push(stats.xpMissed,"missed XP",`${sc.xpMiss||0}pts each`, stats.xpMissed*(sc.xpMiss||0));
  } else {
    push(stats.passYds,"pass yd",`1pt/${sc.passYdsPerPt||25}`, stats.passYds/(sc.passYdsPerPt||25));
    push(stats.passTD,"pass TD",`${sc.passTD||4}pts each`, stats.passTD*(sc.passTD||4));
    push(stats.passInt,"INT thrown",`${sc.passInt||-2}pts each`, stats.passInt*(sc.passInt||-2));
    push(stats.rushYds,"rush yd",`1pt/${sc.rushYdsPerPt||10}`, stats.rushYds/(sc.rushYdsPerPt||10));
    push(stats.rushTD,"rush TD",`${sc.rushTD||6}pts each`, stats.rushTD*(sc.rushTD||6));
    if(stats.rec && sc.ppr) push(stats.rec,"rec",`${sc.ppr}pt each`, stats.rec*sc.ppr);
    push(stats.recYds,"rec yd",`1pt/${sc.recYdsPerPt||10}`, stats.recYds/(sc.recYdsPerPt||10));
    push(stats.recTD,"rec TD",`${sc.recTD||6}pts each`, stats.recTD*(sc.recTD||6));
    push(stats.fumLost,"fum lost",`${sc.fumLost||-2}pts each`, stats.fumLost*(sc.fumLost||-2));
  }
  return lines;
}
function openPlayerBoxScore(p, wk, returnTo){
  wk = wk || app.currentWeek || 1;
  const row=app.playerWeekStats[wk] && app.playerWeekStats[wk][p.id];
  const pu=app.powerupPicks.find(x=>x.week===wk && x.player_id===p.id);
  const ov=$("overlay");
  const pic=p.headshot?`<img src="${p.headshot}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;background:#1a2e22">`:avatarHTML(p);
  const gi=weekGameInfo(p, wk);
  let rows="", total=0;
  for(let q=1;q<=4;q++){
    const qd=row && row.q_pts && (row.q_pts[q]||row.q_pts[String(q)]);
    const lines=quarterStatLines(p.pos, qd&&qd.stats);
    const isPuQ=pu && Number(pu.quarter)===q; const cfg=isPuQ?POWERUPS[pu.powerup_key]:null;
    const mult = cfg&&pu.powerup_key==="double" ? 2 : (cfg&&pu.powerup_key==="freeze" ? 0 : 1);
    let qTotal=0;
    const lineHtml = lines.length ? lines.map(l=>{
      const adj=Math.round(l.pts*mult*10)/10; qTotal+=adj;
      const tag = mult!==1 ? ` <b style="color:var(--gold)">× ${mult===0?"0":mult} ${cfg.icon}</b>` : "";
      return `<div>${l.label}${tag} <span style="float:right">${adj.toFixed(1)}pts</span></div>`;
    }).join("") : `<span class="muted">—</span>`;
    rows+=`<tr><td style="vertical-align:top">Q${q}</td><td style="font-size:12px">${lineHtml}</td><td style="text-align:right;font-weight:700;vertical-align:top">${qTotal.toFixed(1)}</td></tr>`;
    total+=qTotal;
  }
  let paRow="";
  if(row && row.q_pts && row.q_pts.pa){
    const pa=row.q_pts.pa; total+=pa.fp;
    paRow=`<tr style="border-top:1px solid var(--line)"><td>—</td><td style="font-size:12px">${pa.allowed} total points allowed (whole game)</td><td style="text-align:right;font-weight:700">${pa.fp.toFixed(1)}</td></tr>`;
  }
  const teamLine = p.pos+" · "+(p.teamAb||"")+(gi?(" · "+(gi.home?"vs ":"@ ")+gi.opp):"");
  const noData = !row ? `<div class="muted" style="font-size:12px;margin-top:10px">No live data yet — this player's game may not have started, or their team hasn't been polled yet. It updates automatically once it's live.</div>` : "";
  ov.innerHTML=`<div class="modal"><div class="box" style="max-width:440px;text-align:left">
    <div class="modal-x" id="pbClose">✕</div>
    <div style="display:flex;align-items:center;gap:10px">${pic}<div><div style="font-weight:800">${p.name}</div><div class="muted" style="font-size:12px">${teamLine}</div></div></div>
    <div style="overflow-x:auto;margin-top:12px"><table class="std"><tr><th>Qtr</th><th>Stats</th><th style="text-align:right">FP</th></tr>${rows}${paRow}
      <tr style="border-top:2px solid var(--line)"><td colspan="2" style="font-weight:800">Total</td><td style="text-align:right;font-weight:800;color:var(--gold)">${total.toFixed(1)}</td></tr>
    </table></div>
    ${noData}
  </div></div>`;
  ov.querySelector("#pbClose").onclick=()=>{ if(returnTo) returnTo(); else ov.innerHTML=""; };
}

// espnId — so rebuild it the same way the roster-action modals already do

function openPlayerCardFor(p){

  openPlayerDetail({ id:p.id, espnId:(p.id||"").replace(/^e/,""), name:p.name, pos:p.pos, teamAb:p.teamAb, headshot:p.headshot });

function statGroups(names){
  const g={passing:[],rushing:[],receiving:[],kicking:[]};
  (names||[]).forEach((n,i)=>{ const s=n.toLowerCase();
    if(/pass|completion|interception|sack|qbr/.test(s)) g.passing.push(i);
    else if(/rush/.test(s)) g.rushing.push(i);
    else if(/receiv|reception/.test(s)) g.receiving.push(i);
    else if(/fieldgoal|extrapoint|\bkick|punt/.test(s)) g.kicking.push(i);
  });
  return g;
}
function weekFP(names, stats){
  const sc=app.settings.scoring, gi=(n)=>{ const i=names.indexOf(n); return i>=0?(parseFloat(String(stats[i]||"0").replace(/,/g,""))||0):0; };
  let fp=0;
  fp += gi("passingYards")/(sc.passYdsPerPt||25);
  fp += gi("passingTouchdowns")*(sc.passTD||4);
  fp += gi("interceptions")*(sc.passInt||-2);
  fp += gi("rushingYards")/(sc.rushYdsPerPt||10);
  fp += gi("rushingTouchdowns")*(sc.rushTD||6);
  fp += gi("receptions")*(sc.ppr||0);
  fp += gi("receivingYards")/(sc.recYdsPerPt||10);
  fp += gi("receivingTouchdowns")*(sc.recTD||6);
  fp += gi("fumblesLost")*(sc.fumLost||-2);
  return Math.round(fp*10)/10;
}
function gamelogWeekly(gl){
  if(!gl) return null; const names=gl.names||[], labels=gl.labels||[], ev=gl.events||{};
  let cat=null;
  (gl.seasonTypes||[]).forEach(st=>{ if(!cat && /Regular/.test(st.displayName||"")){ (st.categories||[]).forEach(c=>{ if(!cat && (c.events||[]).length) cat=c; }); } });
  if(!cat) (gl.seasonTypes||[]).forEach(st=>{ (st.categories||[]).forEach(c=>{ if(!cat && (c.events||[]).length) cat=c; }); });
  if(!cat) return null;
  const rows=(cat.events||[]).map(e=>{ const m=ev[e.eventId]||{};
    return { wk:m.week||0, opp:(m.atVs||"")+((m.opponent&&m.opponent.abbreviation)||""), stats:e.stats||[], fp:weekFP(names,e.stats||[]) }; })
    .sort((a,b)=>a.wk-b.wk);
  const cats=(gl.categories||[]).filter(c=>["passing","rushing","receiving","kicking"].includes(c.name)).map(c=>({name:c.name,display:c.displayName||c.name}));
  return { names, labels, rows, cats };
}

function sortPoolBy(list, s, dir){
  if(s==="lastwk" || s==="proj"){
    const getter = s==="lastwk" ? (id=>lastWeekScoreOf(id)) : (id=>playerProjEstimate(id));
    const mul = dir==="asc" ? 1 : -1;
    return list.slice().sort((a,b)=>{
      const av=getter(a.id), bv=getter(b.id);
      if(av==null && bv==null) return 0;
      if(av==null) return 1; if(bv==null) return -1; // no data yet always sinks to the bottom
      return mul*(av-bv);

function draftSlot(pickNo,T){ const r=Math.floor((pickNo-1)/T); const i=(pickNo-1)%T; return r%2===0? i : T-1-i; }
function simDraft(){
  const teams=LEAGUE.map(t=>t.team), T=teams.length; let guard=0;
  while(guard++<600){ const pn=app.drafted.length+1; const oc=teams[draftSlot(pn,T)];
    if(oc===app.myTeam) break;
    const dset=new Set(app.drafted.map(d=>d.p.id));
    const best=availablePlayers().filter(p=>!dset.has(p.id)).sort((a,b)=>b.proj-a.proj)[0];
    if(!best) break; app.drafted.push({p:best,by:oc,pick:pn}); }
  renderDraft();
}
// ---- real, persisted, multi-user draft (Supabase + realtime) ----
async function loadDraft(){
  const lid=app.sbLeagueId; if(!lid) return;
  try{
    const [dr,pk,mm]=await Promise.all([
      sb.from("drafts").select("*").eq("league_id",lid).maybeSingle(),
      sb.from("draft_picks").select("*").eq("league_id",lid).order("pick_no"),
      sb.from("league_members").select("user_id, team_name").eq("league_id",lid)
    ]);
    const memMap={}; (mm.data||[]).forEach(m=>memMap[m.user_id]=m.team_name||"Team");
    const d=dr.data;
    app.draft={ status:(d&&d.status)||"pre", rounds:(d&&d.rounds)||15, order:(d&&d.member_order)||[], picks:pk.data||[], memMap };
  }catch(e){ app.draft={ status:"pre", rounds:15, order:[], picks:[], memMap:{} }; }
}
function subscribeDraft(){
  if(app.draftChannel || !app.sbLeagueId) return;
  const lid=app.sbLeagueId;
  // Covers live draft picks AND free-agent adds/drops (both land in
  // draft_picks — it's the roster-ownership table) — needs a full render()
  // like every other handler here, not just draft/team, since a pickup
  // needs to disappear from the Players tab live too, not just the two
  // tabs that show your own roster.
  const refresh=async ()=>{ await loadDraft(); if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  const refreshTrades=async ()=>{ const before=app.trades.filter(t=>t.to_user===app.user.id&&t.status==="pending").length;
    await loadTrades(); const after=app.trades.filter(t=>t.to_user===app.user.id&&t.status==="pending").length;
    if(after>before) toast("📨 New trade offer!");
    if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  const refreshTx=async ()=>{ await loadTransactions(); if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  const refreshSchedule=async ()=>{ await loadSchedule(); await loadLeagueData(); if(app.realLeague) setupRealMatchup();
    if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  const refreshWaivers=async ()=>{ await loadWaivers(); if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  const refreshPlayoffs=async ()=>{ await loadPlayoffMatchups(); if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  const refreshTradeVotes=async ()=>{ await loadTrades(); if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  const refreshScoring=async ()=>{ if(!app.realLeague) return; await loadAllRealScoringData(); refreshRealInv();
    if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  const refreshLineups=async ()=>{ if(!app.realLeague) return; await loadLineup(); await loadAllLineups();
    if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  // Team renames and username changes — league_members/profiles were never
  // even subscribed to before (on top of never being in the realtime
  // publication at all, fixed in phase8's SQL), so neither ever pushed live.
  const refreshMembers=async ()=>{ await loadLeagueData(); if(!app.showConfirm && app.user && app.connectedLeague) render(); };
  app.draftChannel=sb.channel("draft-"+lid)
    .on("postgres_changes",{event:"*",schema:"public",table:"draft_picks",filter:"league_id=eq."+lid}, refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"drafts",filter:"league_id=eq."+lid}, refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"trades",filter:"league_id=eq."+lid}, refreshTrades)
    .on("postgres_changes",{event:"*",schema:"public",table:"transactions",filter:"league_id=eq."+lid}, refreshTx)
    .on("postgres_changes",{event:"*",schema:"public",table:"schedule",filter:"league_id=eq."+lid}, refreshSchedule)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"leagues",filter:"id=eq."+lid}, refreshSchedule)
    .on("postgres_changes",{event:"*",schema:"public",table:"lineups",filter:"league_id=eq."+lid}, refreshLineups)
    .on("postgres_changes",{event:"*",schema:"public",table:"powerup_picks",filter:"league_id=eq."+lid}, refreshScoring)
    .on("postgres_changes",{event:"*",schema:"public",table:"weekly_lineups",filter:"league_id=eq."+lid}, refreshScoring)
    .on("postgres_changes",{event:"*",schema:"public",table:"player_week_stats"}, refreshScoring)
    .on("postgres_changes",{event:"*",schema:"public",table:"waiver_claims",filter:"league_id=eq."+lid}, refreshWaivers)
    .on("postgres_changes",{event:"*",schema:"public",table:"waiver_wire",filter:"league_id=eq."+lid}, refreshWaivers)
    .on("postgres_changes",{event:"*",schema:"public",table:"playoff_matchups",filter:"league_id=eq."+lid}, refreshPlayoffs)
    .on("postgres_changes",{event:"*",schema:"public",table:"trade_votes"}, refreshTradeVotes)
    .on("postgres_changes",{event:"*",schema:"public",table:"league_members",filter:"league_id=eq."+lid}, refreshMembers)
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"}, refreshMembers)
    .subscribe();
}

// Standard starting-lineup slot template (shared by draft view + lineup editor)
const SLOTS=[{lbl:"QB",pos:["QB"]},{lbl:"RB",pos:["RB"]},{lbl:"RB",pos:["RB"]},{lbl:"WR",pos:["WR"]},{lbl:"WR",pos:["WR"]},{lbl:"TE",pos:["TE"]},{lbl:"FLEX",pos:["RB","WR","TE"]},{lbl:"K",pos:["K"]},{lbl:"DEF",pos:["DEF"]}];
// Fit a manager's picks into the slots (+ bench), leaving empties for reference
function fillRoster(picks){
  const filled=SLOTS.map(s=>({lbl:s.lbl,pos:s.pos,p:null}));
  const bench=[];
  picks.forEach(pk=>{
    let slot=filled.find(f=>!f.p && f.lbl!=="FLEX" && f.pos.includes(pk.pos));
    if(!slot) slot=filled.find(f=>!f.p && f.lbl==="FLEX" && f.pos.includes(pk.pos));
    if(slot) slot.p=pk; else bench.push(pk);
  });
  return {filled, bench};
}
// Default starter assignment (array of player_ids aligned to SLOTS)
function defaultStarters(picks){
  const assign=SLOTS.map(()=>null); const used=new Set();
  SLOTS.forEach((slot,i)=>{ if(slot.lbl==="FLEX")return; const p=picks.find(x=>!used.has(x.player_id)&&slot.pos.includes(x.pos)); if(p){assign[i]=p.player_id;used.add(p.player_id);} });
  const fi=SLOTS.findIndex(s=>s.lbl==="FLEX");
  if(fi>=0){ const p=picks.find(x=>!used.has(x.player_id)&&SLOTS[fi].pos.includes(x.pos)); if(p){assign[fi]=p.player_id;used.add(p.player_id);} }
  return assign;
}

// Draft rule: once remaining picks == unfilled required starting slots, you can only draft to fill them
function allowedDraftPositions(userId){
  const picks=(app.draft?app.draft.picks:[]).filter(p=>p.user_id===userId);
  const rounds=(app.draft&&app.draft.rounds)||15;
  const remainingPicks=rounds-picks.length; // includes the pick about to be made
  const {filled}=fillRoster(picks);
  const empty=filled.filter(f=>!f.p);
  if(remainingPicks>empty.length) return null;   // spare picks → anything goes
  const set=new Set(); empty.forEach(f=>f.pos.forEach(p=>set.add(p)));
  return { set, labels:empty.map(f=>f.lbl) };
}

// Locked once that player's REAL NFL game has kicked off — checked against
// the actual kickoff time (not whether we've polled their box score yet, so
// this can't be fooled by a slow poll). Prevents swapping in/out based on

function computeRoundRobin(ids, weeks){
  const teams=ids.slice(); if(teams.length%2) teams.push(null);
  const n=teams.length, rounds=Math.max(1,n-1), half=n/2;
  let lst=teams.slice(1); const games=[];
  for(let w=0; w<weeks; w++){
    const roundArr=[teams[0]].concat(lst);
    for(let i=0;i<half;i++){
      const a=roundArr[i], b=roundArr[n-1-i];
      if(a&&b){ const swap=(w+i)%2===0; games.push({week:w+1, home:swap?a:b, away:swap?b:a}); }
    }
    lst.unshift(lst.pop());
  }
  return games;
}
function simPlayer(pick){ return { id:pick.player_id, name:pick.player_name, pos:pick.pos, teamAb:pick.team, headshot:pick.headshot, num:0, pts:0,yds:0,td:0,rec:0, opp:"" }; }
function emptyP(){ return { id:"e_"+Math.floor(Math.random()*1e9), name:"(empty)", pos:"", teamAb:"", headshot:"", num:0, pts:0,yds:0,td:0,rec:0, opp:"" }; }
function startersForUser(uid, starterIds){
  const picks=(app.draft?app.draft.picks:[]).filter(p=>p.user_id===uid);
  let starters = Array.isArray(starterIds)&&starterIds.length===SLOTS.length ? starterIds : defaultStarters(picks);
  const byId={}; picks.forEach(p=>byId[p.player_id]=p);
  const startersOut=starters.map(id=> (id&&byId[id])? simPlayer(byId[id]) : emptyP());
  const startedSet=new Set(starters.filter(Boolean));
  const bench=picks.filter(p=>!startedSet.has(p.player_id)).map(simPlayer);
  return {startersOut, bench};

// Regular-season pairings live in `schedule`; playoff pairings live in the
// separate `playoff_matchups` table (see phase7 SQL) since who plays whom
// depends on real bracket results, not a precomputed round robin. This
// merges both into the same {week,home_user,away_user} shape so
// weekOpponent()/realOtherMatchups() don't need to care which one it is.
function matchupsForWeek(wk){
  const playoff=(app.playoffMatchups||[])
    .filter(m=>m.home_user && m.away_user && !m.is_bye && wk>=m.start_week && wk<=m.end_week)
    .map(m=>({week:wk, home_user:m.home_user, away_user:m.away_user}));
  // Playoff pairings take priority if both exist for this week — shouldn't
  // normally overlap, but a commissioner setting regSeasonWeeks/playoffWeeks
  // inconsistently (or lowering regSeasonWeeks after generating a longer
  // schedule) could otherwise double-book a manager into two "games" the
  // same week with no dedup.
  if(playoff.length) return playoff;
  return (app.schedule||[]).filter(g=>g.week===wk);
}
function weekOpponent(){
  const wk=app.currentWeek||1;
  const g=matchupsForWeek(wk).find(x=>x.home_user===app.user.id||x.away_user===app.user.id);
  return g ? (g.home_user===app.user.id?g.away_user:g.home_user) : null;
}
// Rebuild the matchup roster whenever the underlying data actually changes
// (new draft picks, a newly-saved lineup, a new week/opponent) — but not on
// every incidental re-render, which would also wipe an in-progress Emergency
// Sub swap (it only mutates the local arrays, not app.lineup/app.draft).
function matchupSetupKey(){
  const oppId=weekOpponent();
  const picksOf=uid=>(app.draft&&app.draft.picks||[]).filter(p=>p.user_id===uid).map(p=>p.player_id).sort().join(",");
  const myLineup=(app.lineup||[]).join(",");
  const oppLineup=(oppId&&app.lineupsByUser[oppId]||[]).join(",");
  return [app.currentWeek||1, oppId||"", picksOf(app.user&&app.user.id), picksOf(oppId), myLineup, oppLineup].join("|");

function setupRealMatchup(){
  const oppId=weekOpponent();
  app.oppTeam = oppId ? teamNameOf(oppId) : "(no game scheduled)";
  const me=startersForUser(app.user.id, app.lineup);
  const op= oppId ? startersForUser(oppId, app.lineupsByUser[oppId]) : {startersOut:SLOTS.map(()=>emptyP()), bench:[]};
  myStarters.length=0; me.startersOut.forEach(p=>myStarters.push(p));
  myBench.length=0; me.bench.forEach(p=>myBench.push(p));
  oppStarters.length=0; op.startersOut.forEach(p=>oppStarters.push(p));
  oppBench.length=0; op.bench.forEach(p=>oppBench.push(p));

// ============================ REAL SCORING ENGINE (Milestone 4c) ============================
// Real leagues: power-up choices persist to Supabase, and real per-quarter
// fantasy points are reconstructed by polling ESPN's live box score while a
// game is in progress (diffing cumulative totals against the last poll and
// attributing the gain to whichever quarter is live right now). Defense
// "points allowed" is exact (from the real linescore), not diffed.
function defBracket(pa){
  const sc=app.settings.scoring;
  if(pa<=0) return sc.pa0!=null?sc.pa0:10;
  if(pa<=6) return sc.pa1_6!=null?sc.pa1_6:8;
  if(pa<=13) return sc.pa7_13!=null?sc.pa7_13:6;
  if(pa<=17) return sc.pa14_17!=null?sc.pa14_17:4;
  if(pa<=21) return sc.pa18_21!=null?sc.pa18_21:2;
  if(pa<=27) return 0; // ESPN awards 0 for 22-27 — no separate setting
  if(pa<=34) return sc.pa28_34!=null?sc.pa28_34:-2;
  if(pa<=45) return sc.pa35_45!=null?sc.pa35_45:-6;
  return sc.pa46p!=null?sc.pa46p:-8;
}
function parseMadeAttempted(str){
  const m=/^(\d+)\s*\/\s*(\d+)$/.exec(String(str||"").trim());
  return m ? {made:parseInt(m[1],10), attempted:parseInt(m[2],10)} : {made:0, attempted:0};
}
// The box score's "kicking" group only exposes aggregate FG made/attempted
// (e.g. "2/3") and the longest make — no per-kick distance. scoringPlays
// (same summary response, no extra fetch) lists each successful FG with a
// parseable text description ("Ka'imi Fairbairn 51 Yd Field Goal ") and a
// clean scoringType flag, which is enough to bucket makes by distance band.
// Missed FGs never appear as scoring plays at all (nothing scored), so
// those come from the aggregate made/attempted gap instead — fine, since
// misses aren't distance-banded anyway (flat penalty).
function fgBandsFromScoringPlays(scoringPlays, teamId, kickerName, aggregateMade){
  const bands={fg0_39:0, fg40_49:0, fg50p:0};
  let matched=0;
  (scoringPlays||[]).forEach(p=>{
    if(!p.scoringType || p.scoringType.name!=="field-goal") return;
    if(!p.team || String(p.team.id)!==String(teamId)) return;
    const m=/^(.+?)\s+(\d+)\s+Yd Field Goal/.exec(p.text||"");
    if(!m || m[1].trim()!==kickerName) return;
    matched++;
    const dist=parseInt(m[2],10);
    if(dist>=50) bands.fg50p++; else if(dist>=40) bands.fg40_49++; else bands.fg0_39++;
  });

  // name-formatting mismatch) — attribute any leftover makes to the
  // cheapest band rather than losing the points entirely.
  bands.fg0_39 += Math.max(0, aggregateMade-matched);

}
function kickerFP(labels, stats, scoringPlays, teamId, kickerName){
  const sc=app.settings.scoring;
  const gi=(lbl)=>{ const i=labels.indexOf(lbl); return i>=0?String(stats[i]||"0/0"):"0/0"; };
  const fg=parseMadeAttempted(gi("FG")), xp=parseMadeAttempted(gi("XP"));
  const bands=fgBandsFromScoringPlays(scoringPlays, teamId, kickerName, fg.made);
  const fgMissed=Math.max(0, fg.attempted-fg.made), xpMissed=Math.max(0, xp.attempted-xp.made);
  const fp = bands.fg0_39*(sc.fg0_39||3) + bands.fg40_49*(sc.fg40_49||4) + bands.fg50p*(sc.fg50p||5)
    + fgMissed*(sc.fgMiss!=null?sc.fgMiss:-1) + xp.made*(sc.xp!=null?sc.xp:1) + xpMissed*(sc.xpMiss||0);
  const raw={ fgMade0_39:bands.fg0_39, fgMade40_49:bands.fg40_49, fgMade50p:bands.fg50p, fgMissed, xpMade:xp.made, xpMissed };
  return {fp, qtd:0, raw};
}
function boxAthleteFP(groupName, labels, stats){
  const sc=app.settings.scoring;
  const gi=(lbl)=>{ const i=labels.indexOf(lbl); return i>=0?(parseFloat(String(stats[i]||"0").replace(/,/g,""))||0):0; };
  let fp=0, qtd=0; const raw={};
  if(groupName==="passing"){ const yds=gi("YDS"),td=gi("TD"),ints=gi("INT");
    fp+=yds/(sc.passYdsPerPt||25); fp+=td*(sc.passTD||4); fp+=ints*(sc.passInt||-2);
    raw.passYds=yds; raw.passTD=td; raw.passInt=ints; }
  else if(groupName==="rushing"){ const yds=gi("YDS"),td=gi("TD");
    fp+=yds/(sc.rushYdsPerPt||10); fp+=td*(sc.rushTD||6); qtd+=td;
    raw.rushYds=yds; raw.rushTD=td; }
  else if(groupName==="receiving"){ const rec=gi("REC"),yds=gi("YDS"),td=gi("TD");
    fp+=rec*(sc.ppr||0); fp+=yds/(sc.recYdsPerPt||10); fp+=td*(sc.recTD||6); qtd+=td;
    raw.rec=rec; raw.recYds=yds; raw.recTD=td; }

}
// Team defense bonus plays: sacks + interceptions + defensive/return TDs.
// (Fumble recoveries are skipped — ESPN's box score doesn't cleanly separate
// "defense recovered opponent's fumble" from "offense recovered its own".)
function teamDefenseBonusFP(statGroups){
  const sc=app.settings.scoring;
  let sacks=0, defTD=0, ints=0, intTD=0;
  (statGroups||[]).forEach(g=>{
    const labels=g.labels||[];
    const gi=(a,lbl)=>{ const i=labels.indexOf(lbl); return i>=0?(parseFloat(String((a.stats||[])[i]||"0").replace(/,/g,""))||0):0; };
    if(g.name==="defensive"){ (g.athletes||[]).forEach(a=>{ sacks+=gi(a,"SACKS"); defTD+=gi(a,"TD"); }); }
    else if(g.name==="interceptions"){ (g.athletes||[]).forEach(a=>{ ints+=gi(a,"INT"); intTD+=gi(a,"TD"); }); }
  });
  const td=defTD+intTD;
  const fp=sacks*(sc.sack||1) + ints*(sc.defInt||2) + td*(sc.defTD||6);

async function findGameId(teamId, wk){

// Defense-vs-position: real fantasy points allowed to each offensive position

// same real per-quarter stats we already collect for rostered players in
// this league — not the full NFL player pool, so it's a reasonable read on
// matchup difficulty, not an official league-wide stat.
async function computeDvP(wkMax){
  const picks=(app.draft&&app.draft.picks)||[];
  const offPicks=picks.filter(p=>p.pos!=="DEF" && p.team);
  const teamAbs=[...new Set(offPicks.map(p=>p.team))];
  const lookups=[];
  for(const ab of teamAbs){
    const tid=teamIdForAb(ab); if(tid==null) continue;
    for(let wk=1; wk<=wkMax; wk++) lookups.push(findGameId(tid, wk));
  }
  await Promise.all(lookups); // parallel — sequential awaits made this take several seconds for no reason
  const agg={};
  for(let wk=1; wk<=wkMax; wk++){
    const wkStats=app.playerWeekStats[wk]||{};
    offPicks.forEach(p=>{
      const row=wkStats[p.player_id]; if(!row||!row.q_pts) return;
      const gi=weekGameInfo({teamAb:p.team}, wk); if(!gi||!gi.opp) return;
      let fp=row.q_pts.pa?row.q_pts.pa.fp:0;
      for(let q=1;q<=4;q++){ const v=row.q_pts[q]||row.q_pts[String(q)]; if(v) fp+=quarterFpFromStats(p.pos, v.stats); }
      const o=agg[gi.opp]=agg[gi.opp]||{}; const pp=o[p.pos]=o[p.pos]||{sum:0,games:0};
      pp.sum+=fp; pp.games+=1;
    });
  }
  const ranks={};
  ["QB","RB","WR","TE"].forEach(pos=>{
    const rows=Object.keys(agg).filter(ab=>agg[ab][pos]).map(ab=>({ab, avg:agg[ab][pos].sum/agg[ab][pos].games}));
    rows.sort((a,b)=>a.avg-b.avg); // fewest allowed first = toughest = rank 1
    ranks[pos]={};
    rows.forEach((r,i)=>{ ranks[pos][r.ab]={rank:i+1, of:rows.length, avg:Math.round(r.avg*10)/10}; });
  });
  return ranks;
}

async function fetchGameBoxFP(eventId){
  const d=await (await fetch(ESPN+"/summary?event="+eventId)).json();
  const comp=(d.header&&d.header.competitions&&d.header.competitions[0])||{};
  const status=comp.status||{};
  const state=status.type&&status.type.state;
  const final=!!(status.type&&status.type.completed);
  // A game that hasn't kicked off yet has no real period — defaulting that
  // to 1 (as if Q1 were already underway) is what locked Q1 out of the
  // quarter picker for players whose games hadn't started.
  const period= final?4 : state==="pre" ? 0 : (status.period||1);
  const scoringPlays=d.scoringPlays||[];
  const byAthlete={}, teamStats={};
  ((d.boxscore&&d.boxscore.players)||[]).forEach(tm=>{
    const tid=String((tm.team&&tm.team.id)||"");
    if(tid) teamStats[tid]=tm.statistics||[];
    (tm.statistics||[]).forEach(g=>{
      (g.athletes||[]).forEach(a=>{
        const id=String((a.athlete&&a.athlete.id)||""); if(!id) return;
        const name=(a.athlete&&a.athlete.displayName)||"";
        const r = g.name==="kicking" ? kickerFP(g.labels||[], a.stats||[], scoringPlays, tid, name) : boxAthleteFP(g.name, g.labels||[], a.stats||[]);
        if(!byAthlete[id]) byAthlete[id]={fp:0,qtd:0,raw:{}};
        byAthlete[id].fp+=r.fp; byAthlete[id].qtd+=r.qtd;
        Object.keys(r.raw).forEach(k=>{ byAthlete[id].raw[k]=(byAthlete[id].raw[k]||0)+r.raw[k]; });
      });
    });
  });

  (comp.competitors||[]).forEach(c=>{
    const tid=String((c.team&&c.team.id)||"");
    linescores[tid]=(c.linescores||[]).map(l=>l.value||0);
  });
  return {period, final, byAthlete, linescores, teamStats};
}
// Poll ESPN for every real player in the current matchup and persist real
// per-quarter fantasy points. Any manager's open app contributes a poll —
// all clients observe the same real-world truth, so last write wins fine.
async function pollRealStats(){
  if(!app.realLeague || !app.sbLeagueId) return;
  // teamIdForAb() can't resolve anyone until app.pool has loaded — without
  // this wait, the very first poll after opening the app/tab would run
  // against an empty pool, find zero teams, and leave quarter-lock state
  // undefined until the next 30s cycle caught up.
  ensurePool();
  for(let i=0;i<25 && (app.poolLoading || (!app.pool && !app.poolError)); i++) await new Promise(r=>setTimeout(r,200));
  const wk=app.currentWeek||1;

  const byTeam={};
  all.forEach(p=>{ const tid=teamIdForAb(p.teamAb); if(!tid) return; (byTeam[tid]=byTeam[tid]||[]).push(p); });

  // awaiting one team at a time, which for a matchup spanning many real NFL
  // teams could take several seconds. Until a team's entry landed here,

  // and defaulted to "unknown" — which is why the quarter picker was letting
  // every quarter be picked mid-game. Parallel fetch closes that window.

    let eventId; try{ eventId=await findGameId(teamId, wk); }catch(e){ return null; }
    if(!eventId) return null;

    const box=boxes[idx]; if(!box) return;

    for(const p of byTeam[teamId]){
      let curFp, curQtd=0, curBonus=0, curBonusTd=0, curRaw=null, curSacks=0, curInts=0, totalAllowed=null;
      if(p.pos==="DEF"){
        const opp=Object.keys(box.linescores).find(t=>t!==teamId);
        const oppLs=opp?box.linescores[opp]:[];

        const bonus=teamDefenseBonusFP(box.teamStats[teamId]);

    }

      const cur=qpts[u.period]||{fp:0,qtd:0,stats:{}};

      const mergedStats={...(cur.stats||{})};

      qpts[u.period]={fp:Math.round((cur.fp+delta)*10)/10, qtd:cur.qtd+tdDelta, stats:mergedStats};

}

async function loadAllRealScoringData(){
  if(!app.sbLeagueId || !app.realLeague) return;

  try{
    const [pu,wl,pws]=await Promise.all([
      sb.from("powerup_picks").select("*").eq("league_id",app.sbLeagueId),
      sb.from("weekly_lineups").select("*").eq("league_id",app.sbLeagueId),
      ids.length ? sb.from("player_week_stats").select("*").in("athlete_id",ids) : Promise.resolve({data:[]}),

    if(!app._scoringLoadWarned){ app._scoringLoadWarned=true; toast("⚠ Couldn't load power-up/score data: "+e.message); }

// For real leagues, weekly inventory is derived from persisted picks (so it
// survives refreshes/devices and naturally refills when the week advances).
function refreshRealInv(){
  if(!app.realLeague || !app.user) return;
  const mine=app.powerupPicks.filter(p=>p.week===app.currentWeek && p.user_id===app.user.id);
  ["double","freeze","sub","hotstart"].forEach(k=>{ app.inv[k]= mine.some(p=>p.powerup_key===k) ? 0 : 1; });
