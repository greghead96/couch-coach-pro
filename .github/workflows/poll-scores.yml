name: Poll live scores

on:
  schedule:
    # Offset from :00/:05/:10... on purpose — GitHub's own docs say the top of
    # every hour is the highest-contention slot for scheduled runs and queues
    # longest there. This avoids that queue, not just wall-clock coincidence.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      force_waivers:
        description: "Force waiver processing this run (bypass the once-a-week timing check — for testing)"
        type: boolean
        default: false

# A run keeps polling for as long as games are live (up to ~5h40m), so the
# 5-minute cron mostly just queues behind the active run — that's the point:
# GitHub's cron has proven unreliable, and one run covering a whole window
# doesn't depend on the next trigger showing up on time.
concurrency:
  group: poll-scores

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # a run now spans a whole game window (see scripts/poll-scores.js main loop); GitHub's hard job limit is 6h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Poll ESPN and update live scores
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_WAIVERS: ${{ github.event.inputs.force_waivers }}
        run: node scripts/poll-scores.js
