name: Poll live scores

on:
  schedule:
    # Offset from :00/:05/:10... on purpose — GitHub's own docs say the top of
    # every hour is the highest-contention slot for scheduled runs and queues
    # longest there. This avoids that queue, not just wall-clock coincidence.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      force_waivers:
        description: "Force waiver processing this run (bypass the once-a-week timing check — for testing)"
        type: boolean
        default: false

# Each run loops internally for ~4.5 minutes (see scripts/poll-scores.js), so
# runs shouldn't overlap in practice — this just guarantees it: if one ever
# runs long, the next scheduled trigger queues instead of running concurrently
# (concurrent runs could double-count the same delta against the same stale
# "previous" snapshot).
concurrency:
  group: poll-scores

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Poll ESPN and update live scores
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_WAIVERS: ${{ github.event.inputs.force_waivers }}
        run: node scripts/poll-scores.js
